  {id:"scl", name:"Santiago, CL",        zone:"Mediterranean", lat:-33.445, lon:-70.6825, elev:null, dpd:10, r:[0.3,0.9,3.4,13.4,32.6,66.5,38.9,34.1,17.1,8.4,3.7,2.2]}
];
const CITY_BY_ID = Object.fromEntries(CITIES.map(c => [c.id, c]));

/* End-use demand presets (litres per person per day) */
const ENDUSES = [
  {id:"wc",       label:"WC flushing",   lpd:25, on:true},
  {id:"laundry",  label:"Laundry",       lpd:15, on:true},
  {id:"cleaning", label:"Cleaning",      lpd:5,  on:false},
  {id:"vehicle",  label:"Vehicle wash",  lpd:2,  on:false}
];

const CLONE = o => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const sum = a => a.reduce((s,v) => s + v, 0);

/* Monthly rainfall is published to one decimal, so a year's total is exact to
   one decimal too — but summing twelve binary floats is not, and Dubai's 79.1
   came out as 79.10000000000001 in the location list. Round the sum to the
   precision the data actually has, rather than formatting the artifact away at
   each place it might surface. */
const annualOf = r => Math.round(sum(r) * 10) / 10;
const D2R = Math.PI / 180;

let _uid = 0;
const uid = () => "b" + (++_uid) + Math.random().toString(36).slice(2, 6);

/* ---- model factories ---- */

function newBlock(over) {
  return Object.assign({
    id: uid(), name: "Block",
    x: 0, z: 0,                 // plan centre (m)
    w: 12, d: 8,                // width (X) and depth (Z) at wall face (m)
    wallH: 6,                   // eaves / wall height (m)
    roof: {
      type: "gable",
      pitch: 30,                // degrees
      overhang: 0.5,            // m, all round
      parapet: 0.6,             // m, flat roof only
      bays: 4,                  // sawtooth
      rise: 3,                  // m, vault
      ridgeRatio: 1             // hip
    },
    material: "rough",
    downpipes: 2
  }, over || {}, over && over.material ? { material: matKey(over.material) } : {});
}

function newModel(over) {
  const m = {
    schema: 2,
    name: "Untitled model",
    note: "",
    blocks: [newBlock({ name: "Block 1" })],
    climate: {
      mode: "preset",           // preset | manual | annual
      cityId: "lon",
      monthly: CITY_BY_ID.lon.r.slice(),
      dpd: CITY_BY_ID.lon.dpd,
      annual: 603,
      label: "London, UK",
      source: "preset",       // preset | preset-scaled | manual | open-meteo
      lat: 51.5, lon: -0.13
    },
    demand: {
      occupants: 4,
      uses: ENDUSES.map(u => ({ id:u.id, lpd:u.lpd, on:u.on })),
      irrigArea: 0,             // m2
      irrigMM: 15,              // mm per week in season
      irrigFrom: 3, irrigTo: 8  // month indices inclusive
    },
    system: {
      filterCoef: 0.90,
      firstFlush: 0,            // mm diverted per rain event
      dryDays: 18,              // design dry period (days) for the basic approach
      tankMode: "auto",         // auto (BS basic approach) | manual
      tank: 3000,               // litres, used when manual
      daily: false,             // daily (wet-day) balance instead of monthly
      tariff: 2.20              // currency per m3 of mains water displaced
    },
    view: { style: "shaded", grid: true, system: true, dims: true }
  };
  return Object.assign(m, over || {});
}

/* ═══════════════════════════ GEO ═══════════════════════════
   Turns a block into planar faces. Two families:
     profile roofs  — a (z,y) polyline extruded along X
     radial roofs   — hip and pyramid, built on the expanded footprint
   Every face carries its own projected (plan) area and true surface area,
   because the difference between the two is the whole point of the app.
   ========================================================================== */

let _geomUid = 0;
const GEO = (() => {

  /* --- generic planar-polygon measures ------------------------------- */

  function newell(pts) {                       // area vector (Newell's method)
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      nx += (a[1] - b[1]) * (a[2] + b[2]);
      ny += (a[2] - b[2]) * (a[0] + b[0]);
      nz += (a[0] - b[0]) * (a[1] + b[1]);
    }
    return [nx / 2, ny / 2, nz / 2];
  }
  const surfaceArea  = pts => { const n = newell(pts); return Math.hypot(n[0], n[1], n[2]); };
  const projectedArea = pts => Math.abs(newell(pts)[1]);   // |y| of the area vector = plan area

  function unit(v) { const L = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/L, v[1]/L, v[2]/L]; }
  function centroid(pts) {
    let x=0,y=0,z=0; for (const p of pts) { x+=p[0]; y+=p[1]; z+=p[2]; }
    return [x/pts.length, y/pts.length, z/pts.length];
  }

  function face(pts, kind, block) {
    const n = newell(pts);
    return {
      pts, kind, block: block.id, material: block.material,
      normal: unit(n),
      surfaceArea: Math.hypot(n[0], n[1], n[2]),
      projArea: kind === "roof" ? Math.abs(n[1]) : 0,
      centroid: centroid(pts)
    };
  }

  /* --- the (z,y) profile ---------------------------------------------- */

  function profile(b) {
    const R = b.roof, h = b.wallH, D = b.d / 2, O = Math.max(0, R.overhang);
    const t = Math.tan(clamp(R.pitch, 1, 75) * D2R);
    const p = [];

    switch (R.type) {
      case "flat":
        p.push([-D - O, h], [D + O, h]);
        break;

      case "gable":
        p.push([-D - O, h - O * t], [0, h + D * t], [D + O, h - O * t]);
        break;

      case "shed": {                       // low eave at +z, high eave at -z
        const y = z => h + t * (D - z);
        p.push([-D - O, y(-D - O)], [D + O, y(D + O)]);
        break;
      }

      case "butterfly":
        p.push([-D - O, h + t * (D + O)], [0, h], [D + O, h + t * (D + O)]);
        break;

      case "sawtooth": {
        const n = clamp(Math.round(R.bays), 1, 12), bd = (2 * D) / n;
        p.push([-D - O, h - t * O]);
        for (let i = 0; i < n; i++) {
          const z0 = -D + i * bd, z1 = z0 + bd;
          p.push([z0, h], [z1, h + t * bd], [z1, h]);   // slope, then vertical glazing
        }
        p.splice(1, 1);                                  // first [z0,h] duplicates the overhang start
        break;
      }

      case "vault": {
        const rise = clamp(R.rise, 0.3, D * 3);
        const Rad = (D * D + rise * rise) / (2 * rise);
        const cy = h + rise - Rad;
        const y = z => cy + Math.sqrt(Math.max(0, Rad * Rad - z * z));
        const slope = D / Math.sqrt(Math.max(1e-6, Rad * Rad - D * D)); // |dy/dz| at the springing
        if (O > 0) p.push([-D - O, y(-D) - O * slope]);
        const N = 18;
        for (let i = 0; i <= N; i++) { const z = -D + (2 * D * i) / N; p.push([z, y(z)]); }
        if (O > 0) p.push([D + O, y(D) - O * slope]);
        break;
      }
    }
    return p;
  }

  /* --- faces for one block --------------------------------------------- */

  function blockFaces(b) {
    const out = [];
    const h = b.wallH, W = b.w / 2, D = b.d / 2;
    const R = b.roof, O = Math.max(0, R.overhang);
    const t = Math.tan(clamp(R.pitch, 1, 75) * D2R);
    const SEAT = 0.03;                    // wall head sits just under the roof
    const ox = b.x, oz = b.z;
    const P = (x, y, z) => [x + ox, y, z + oz];

    /* Walls stop SEAT below the roof line. The roof passes through y = h at the
       wall face, so a wall that reached h would be exactly coincident with it,
       and coincident surfaces have no correct painter's order. */
    const hw = h - SEAT;
    out.push(face([P(-W,0,D),  P(W,0,D),  P(W,hw,D),  P(-W,hw,D)],  "wall", b));
    out.push(face([P(W,0,-D),  P(-W,0,-D),P(-W,hw,-D),P(W,hw,-D)],  "wall", b));
    out.push(face([P(W,0,D),   P(W,0,-D), P(W,hw,-D), P(W,hw,D)],   "wall", b));
    out.push(face([P(-W,0,-D), P(-W,0,D), P(-W,hw,D), P(-W,hw,-D)], "wall", b));

    if (ROOFS[R.type].radial) {
      /* ---- hip / pyramid ---- */
      const W2 = W + O, D2 = D + O, ye = h - O * t;
      const c = [P(-W2,ye,-D2), P(W2,ye,-D2), P(W2,ye,D2), P(-W2,ye,D2)];
      if (R.type === "pyramid") {
        const apex = P(0, ye + t * Math.min(W2, D2), 0);
        for (let i = 0; i < 4; i++) out.push(face([c[i], c[(i+1)%4], apex], "roof", b));
      } else {
        const rl = clamp(R.ridgeRatio, 0, 1) * Math.max(0, 2*W2 - 2*D2);
        const ry = ye + t * D2;
        const r0 = P(-rl/2, ry, 0), r1 = P(rl/2, ry, 0);
        out.push(face([c[3], c[2], r1, r0], "roof", b));   // +z plane
        out.push(face([c[1], c[0], r0, r1], "roof", b));   // -z plane
        out.push(face([c[0], c[3], r0], "roof", b));       // -x hip end
        out.push(face([c[2], c[1], r1], "roof", b));       // +x hip end
      }
    } else {
      /* ---- extruded profile ---- */
      const p = profile(b), X = W + O;
      for (let i = 0; i < p.length - 1; i++) {
        const [z1, y1] = p[i], [z2, y2] = p[i + 1];
        if (Math.abs(z2 - z1) < 1e-9 && Math.abs(y2 - y1) < 1e-9) continue;
        const vertical = Math.abs(z2 - z1) < 1e-6;
        out.push(face(
          [P(-X,y1,z1), P(X,y1,z1), P(X,y2,z2), P(-X,y2,z2)],
          vertical ? "glazing" : "roof", b));
      }

      /* roof height at a given z, used to close the walls under the roof */
      const yAt = z => {
        for (let i = 0; i < p.length - 1; i++) {
          const a = p[i], c2 = p[i + 1];
          if (z >= Math.min(a[0], c2[0]) - 1e-6 && z <= Math.max(a[0], c2[0]) + 1e-6) {
            if (Math.abs(c2[0] - a[0]) < 1e-9) return Math.max(a[1], c2[1]);
            return a[1] + (c2[1] - a[1]) * (z - a[0]) / (c2[0] - a[0]);
          }
        }
        return h;
      };

      /* gable-end infill at x = ±W: the profile clipped to the wall footprint,
         closed back along the wall head. Clip rather than filter, so a roof whose
         only profile points sit outside ±D (shed, vault) still gets its infill.
         The top is dropped by SEAT so the wall never lies exactly ON the roof
         surface — coincident surfaces have no correct painter's order and show
         up as wall-coloured wedges punched through the roof. */
      const inner = [
        [-D, yAt(-D)],
        ...p.filter(q => q[0] > -D + 1e-6 && q[0] < D - 1e-6).map(q => [q[0], q[1]]),
        [D, yAt(D)]
      ].map(q => [q[0], Math.max(h, q[1] - SEAT)]);
      if (inner.some(q => q[1] > h + 1e-4)) {
        const poly = [[-D, hw], ...inner, [D, hw]];
        const dedup = poly.filter((q, i) => i === 0 || Math.hypot(q[0]-poly[i-1][0], q[1]-poly[i-1][1]) > 1e-6);
        if (dedup.length >= 3 && surfaceArea(dedup.map(q => [0, q[1], q[0]])) > 1e-4) {
          out.push(face(dedup.map(q => P( W, q[1], q[0])), "wall", b));
          out.push(face(dedup.slice().reverse().map(q => P(-W, q[1], q[0])), "wall", b));
        }
      }

      /* infill at z = ±D where the profile rises above the wall head */
      for (const s of [-1, 1]) {
        const yTop = Math.max(h, yAt(s * D) - SEAT);
        if (yTop > h + 1e-4) {
          const pts = s > 0
            ? [P(-W,hw,D),  P(W,hw,D),  P(W,yTop,D),  P(-W,yTop,D)]
            : [P(W,hw,-D),  P(-W,hw,-D),P(-W,yTop,-D),P(W,yTop,-D)];
          out.push(face(pts, "wall", b));
        }
      }

      /* parapet on flat roofs */
      if (R.type === "flat" && R.parapet > 0.02) {
        const pp = R.parapet;
        out.push(face([P(-W,h,D),  P(W,h,D),  P(W,h+pp,D),  P(-W,h+pp,D)],  "parapet", b));
        out.push(face([P(W,h,-D),  P(-W,h,-D),P(-W,h+pp,-D),P(W,h+pp,-D)],  "parapet", b));
        out.push(face([P(W,h,D),   P(W,h,-D), P(W,h+pp,-D), P(W,h+pp,D)],   "parapet", b));
        out.push(face([P(-W,h,-D), P(-W,h,D), P(-W,h+pp,D), P(-W,h+pp,-D)], "parapet", b));
      }
    }
    return out;
  }

  /* --- gutters and downpipes, derived from the roof faces -------------- */

  function drainage(faces, blocks) {
    const roofs = faces.filter(f => f.kind === "roof");

    /* count how often each edge is used by a roof face: an edge shared by two
       roof planes is an internal seam (a vault's tessellation, a valley), not
       an eave, so it must not carry a gutter. */
    const key = (a, c) => {
      const r = v => v.map(n => Math.round(n * 1000) / 1000).join(",");
      const ka = r(a), kc = r(c);
      return ka < kc ? ka + "|" + kc : kc + "|" + ka;
    };
    const shared = new Map();
    for (const f of roofs)
      for (let i = 0; i < f.pts.length; i++) {
        const k = key(f.pts[i], f.pts[(i + 1) % f.pts.length]);
        shared.set(k, (shared.get(k) || 0) + 1);
      }

    const gutters = [];
    for (const f of roofs) {
      const flat = Math.abs(f.normal[1]) > 0.999;
      let best = null;
      for (let i = 0; i < f.pts.length; i++) {
        const a = f.pts[i], c = f.pts[(i + 1) % f.pts.length];
        if (Math.abs(a[1] - c[1]) > 1e-4) continue;               // not level -> not an eave
        const len = Math.hypot(a[0] - c[0], a[2] - c[2]);
        if (len < 1e-4) continue;
        if ((shared.get(key(a, c)) || 0) > 1) continue;            // internal seam
        /* a dead-flat plane has no low side, so drain it to +z by convention */
        const rank = flat ? (a[2] + c[2]) / 2 : -(a[1] + c[1]) / 2;
        if (!best || rank > best.rank + 1e-6 || (Math.abs(rank - best.rank) < 1e-6 && len > best.len))
          best = { a, c, rank, len };
      }
      if (best) gutters.push({ a: best.a, b: best.c, blk: f.block, len: best.len });
    }

    /* downpipes: spread each block's stated count evenly along its own gutters */
    const pipes = [];
    for (const b of (blocks || [])) {
      const g = gutters.filter(x => x.blk === b.id);
      const total = sum(g.map(x => x.len));
      const n = clamp(Math.round(b.downpipes || 1), 1, 24);
      if (!g.length || total <= 0) continue;
      for (let i = 0; i < n; i++) {
        let s = ((i + 0.5) / n) * total;
        for (const seg of g) {
          if (s <= seg.len || seg === g[g.length - 1]) {
            const u = clamp(seg.len > 0 ? s / seg.len : 0, 0, 1);
            pipes.push({
              x: seg.a[0] + (seg.b[0] - seg.a[0]) * u,
              z: seg.a[2] + (seg.b[2] - seg.a[2]) * u,
              top: seg.a[1] + (seg.b[1] - seg.a[1]) * u
            });
            break;
          }
          s -= seg.len;
        }
      }
    }
    return { gutters, pipes };
  }

  /* --- tessellation -----------------------------------------------------
     The painter's algorithm orders whole faces by centroid depth. A 12 x 8 m
     roof plane and a small gable-end infill then get ranked on their centroids
     alone, and the large plane paints over the wall that should occlude it.
     Splitting every face into small triangles puts each centroid close to its
     own local depth, which is what removes the inversions.
     ---------------------------------------------------------------------- */

  function earClip(pts, normal) {
    const n = pts.length;
    if (n < 3) return [];
    if (n === 3) return [[0, 1, 2]];

    /* work in the plane the face is most parallel to */
    const ax = Math.abs(normal[0]), ay = Math.abs(normal[1]), az = Math.abs(normal[2]);
    const [i0, i1] = ax >= ay && ax >= az ? [1, 2] : ay >= az ? [2, 0] : [0, 1];
    const q = pts.map(p => [p[i0], p[i1]]);

    let area2 = 0;
    for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % n]; area2 += a[0]*b[1] - b[0]*a[1]; }
    let V = pts.map((_, i) => i);
    if (area2 < 0) V.reverse();

    const cross = (a, b, c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
    const inTri = (p, a, b, c) => {
      const d1 = cross(a, b, p), d2 = cross(b, c, p), d3 = cross(c, a, p);
      const neg = d1 < -1e-12 || d2 < -1e-12 || d3 < -1e-12;
      const pos = d1 >  1e-12 || d2 >  1e-12 || d3 >  1e-12;
      return !(neg && pos);
    };

    const tris = [];
    let guard = 3 * n;
    while (V.length > 3 && guard-- > 0) {
      let cut = false;
      for (let i = 0; i < V.length; i++) {
        const a = V[(i + V.length - 1) % V.length], b = V[i], c = V[(i + 1) % V.length];
        if (cross(q[a], q[b], q[c]) <= 1e-12) continue;             // reflex or degenerate
        let clear = true;
        for (const v of V) {
          if (v === a || v === b || v === c) continue;
          if (inTri(q[v], q[a], q[b], q[c])) { clear = false; break; }
        }
        if (!clear) continue;
        tris.push([a, b, c]); V.splice(i, 1); cut = true; break;
      }
      if (!cut) break;                                              // degenerate: fall through
    }
    if (V.length === 3) tris.push([V[0], V[1], V[2]]);
    if (!tris.length) for (let i = 1; i < n - 1; i++) tris.push([0, i, i + 1]);   // fan fallback
    return tris;
  }

  /* recursive longest-edge bisection. e[k] flags the edge p[k] -> p[k+1] as part
     of the original polygon boundary, so only real edges get stroked. */
  function bisect(t, maxEdge, out, depth) {
    const p = t.p;
    const L = [
      Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1], p[0][2]-p[1][2]),
      Math.hypot(p[1][0]-p[2][0], p[1][1]-p[2][1], p[1][2]-p[2][2]),
      Math.hypot(p[2][0]-p[0][0], p[2][1]-p[0][1], p[2][2]-p[0][2])
    ];
    let k = 0; if (L[1] > L[k]) k = 1; if (L[2] > L[k]) k = 2;
    if (L[k] <= maxEdge || depth >= 9) { out.push(t); return; }
    const i = k, j = (k + 1) % 3, o = (k + 2) % 3;
    const m = [(p[i][0]+p[j][0])/2, (p[i][1]+p[j][1])/2, (p[i][2]+p[j][2])/2];
    bisect({ p: [p[i], m, p[o]], e: [t.e[i], false, t.e[o]] }, maxEdge, out, depth + 1);
    bisect({ p: [m, p[j], p[o]], e: [t.e[i], t.e[j], false  ] }, maxEdge, out, depth + 1);
  }

  /* An edge shared by two faces of the same block is a crease only if the two
     really turn: a gable ridge (60 deg) is drawn, the 18 strips of a barrel
     vault (10 deg each) are not, or the vault reads as a faceted drum. */
  function markSmoothEdges(faces) {
    const key = (a, c) => {
      const r = v => v.map(n => Math.round(n * 1000) / 1000).join(",");
      const ka = r(a), kc = r(c);
      return ka < kc ? ka + "|" + kc : kc + "|" + ka;
    };
    const map = new Map();
    for (const f of faces) {
      for (let i = 0; i < f.pts.length; i++) {
        const k = key(f.pts[i], f.pts[(i + 1) % f.pts.length]);
        let arr = map.get(k);
        if (!arr) { arr = []; map.set(k, arr); }
        arr.push(f);
      }
    }
    const COS = Math.cos(16 * D2R);
    for (const f of faces) {
      f.softEdge = new Array(f.pts.length).fill(false);
      for (let i = 0; i < f.pts.length; i++) {
        const g = map.get(key(f.pts[i], f.pts[(i + 1) % f.pts.length]));
        if (!g || g.length !== 2) continue;
        const o = g[0] === f ? g[1] : g[0];
        if (o.block !== f.block || o.kind !== f.kind) continue;
        const dot = f.normal[0]*o.normal[0] + f.normal[1]*o.normal[1] + f.normal[2]*o.normal[2];
        if (Math.abs(dot) > COS) f.softEdge[i] = true;
      }
    }
  }

  function tessellate(face, maxEdge) {
    const pts = face.pts, n = pts.length;
    const seeds = earClip(pts, face.normal).map(ix => ({
      p: ix.map(i => pts[i]),
      /* an edge of the triangle is a boundary edge only if its two indices are
         adjacent around the original polygon */
      e: ix.map((a, k) => {
        const b = ix[(k + 1) % 3];
        const ei = b === (a + 1) % n ? a : a === (b + 1) % n ? b : -1;
        if (ei < 0) return false;                       // interior diagonal
        return !(face.softEdge && face.softEdge[ei]);
      })
    }));
    const out = [];
    for (const t of seeds) bisect(t, maxEdge, out, 0);
    for (const t of out) t.c = [
      (t.p[0][0]+t.p[1][0]+t.p[2][0])/3,
      (t.p[0][1]+t.p[1][1]+t.p[2][1])/3,
      (t.p[0][2]+t.p[1][2]+t.p[2][2])/3
    ];
    return out;
  }

  /* Triangle budget: pick the edge length that lands near TARGET triangles for
     this model, bounded relative to the scene so a tiny model is not shattered
     and a huge one is still subdivided enough to sort correctly. */
  function edgeBudget(faces, blocks) {
    const area = sum(faces.map(f => f.surfaceArea));
    const TARGET = 3500;
    /* longest-edge bisection lands around 13*area/e^2 triangles, not the
       2*area/e^2 a naive area estimate suggests — it keeps splitting until
       EVERY edge is under the limit, so most end up well below it. */
    const e = Math.sqrt(Math.max(1e-6, 13 * area / TARGET));
    /* bound against typical block size, not the whole scene: a six-block model
       still needs pieces small relative to each 12 m block */
    const d = blocks.length
      ? blocks.map(b => Math.hypot(b.w, b.d, b.wallH)).sort((x, y) => x - y)[blocks.length >> 1]
      : 16;
    return clamp(e, d / 10, d / 3);
  }

  /* Footprints that overlap in plan double-count catchment and break the depth
     sort. Nothing enforced the on-screen warning, so detect it. */
  function planOverlaps(blocks) {
    const box = b => {
      const o = Math.max(0, b.roof.overhang);
      return [b.x - b.w/2 - o, b.x + b.w/2 + o, b.z - b.d/2 - o, b.z + b.d/2 + o];
    };
    const out = [];
    for (let i = 0; i < blocks.length; i++) {
      for (let j = i + 1; j < blocks.length; j++) {
        const A = box(blocks[i]), B = box(blocks[j]);
        const ox = Math.min(A[1], B[1]) - Math.max(A[0], B[0]);
        const oz = Math.min(A[3], B[3]) - Math.max(A[2], B[2]);
        if (ox > 1e-3 && oz > 1e-3)
          out.push({ a: blocks[i].id, b: blocks[j].id, area: ox * oz,
                     names: [blocks[i].name, blocks[j].name] });
      }
    }
    return out;
  }

  /* --- whole model ------------------------------------------------------ */

  function build(model) {
    const faces = [];
    for (const b of model.blocks) faces.push(...blockFaces(b));

    const per = model.blocks.map(b => {
      const bf = faces.filter(f => f.block === b.id && f.kind === "roof");
      const proj = sum(bf.map(f => f.projArea));
      const surf = sum(bf.map(f => f.surfaceArea));
      return { id: b.id, name: b.name, proj, surf, yc: MATERIALS[b.material].yc, material: b.material };
    });

    const bounds = { min: [ 1e9, 1e9, 1e9], max: [-1e9,-1e9,-1e9] };
    for (const f of faces) for (const p of f.pts) for (let i = 0; i < 3; i++) {
      if (p[i] < bounds.min[i]) bounds.min[i] = p[i];
      if (p[i] > bounds.max[i]) bounds.max[i] = p[i];
    }

    const diag = Math.max(2, Math.hypot(
      bounds.max[0] - bounds.min[0], bounds.max[1] - bounds.min[1], bounds.max[2] - bounds.min[2]));
    markSmoothEdges(faces);
    const overlaps = planOverlaps(model.blocks);
    const maxEdge = edgeBudget(faces, model.blocks);
    const prims = [];
    for (const f of faces) for (const t of tessellate(f, maxEdge)) { t.f = f; prims.push(t); }

    return {
      faces, prims, maxEdge, diag,
      uid: ++_geomUid,
      overlaps: overlaps,
      overlapIds: new Set(overlaps.flatMap(o => [o.a, o.b])),
      per, bounds,
      catchment: sum(per.map(p => p.proj)),
      surface:   sum(per.map(p => p.surf)),
      /* area-weighted mean yield coefficient across mixed materials */
      ycMean: sum(per.map(p => p.proj)) > 0
        ? sum(per.map(p => p.proj * p.yc)) / sum(per.map(p => p.proj)) : 0,
      drain: drainage(faces, model.blocks),
      footprint: sum(model.blocks.map(b => b.w * b.d))
    };
  }

  return { build, blockFaces, profile, surfaceArea, projectedArea, tessellate, planOverlaps };
})();

/* ═══════════════════════════ HYD ═══════════════════════════
   Hydrology. Yield to BS EN 16941-1:2024, clause 6.1.2, Formula (1). That
   standard's national foreword describes BS 8515:2009+A1:2013 as the code of
   practice "which this standard replaces":

       Y(R,t) = Σ A(i) · e(i) · h(t) · η      litres, with A in m² and h in mm
                                              (1 mm falling on 1 m² = 1 litre)

   A is the HORIZONTAL PROJECTION of the collection area — the standard's own
   words — which is why pitch never changes the catchment here. The sum runs over
   surfaces, so blocks with different materials keep their own coefficient.
   e is the surface yield coefficient (Table 2); η the hydraulic treatment
   efficiency coefficient.

   The store is then operated by Formulas (A.3) and (A.4) of Annex A.2.2.3:
   abstraction is the lesser of the demand and the volume in the store at the end
   of the previous step, before this step's inflow is added. That convention is
   known as YAS (Yield After Spillage) and is the conservative one.
   ========================================================================== */

const HYD = (() => {

  /* wet days per month, derived from the monthly depth and the location's
     typical depth per wet day. Used for first-flush losses and daily stepping. */
  function wetDays(model) {
    const dpd = Math.max(2, model.climate.dpd || 8);
    return model.climate.monthly.map((mm, i) =>
      mm <= 0 ? 0 : clamp(Math.round(mm / dpd), 1, DAYS_IN_MONTH[i]));
  }

  function demandMonthly(model) {
    const D = model.demand;
    const perPerson = sum(D.uses.filter(u => u.on).map(u => u.lpd));
    const daily = perPerson * Math.max(0, D.occupants);
    const from = Math.min(D.irrigFrom, D.irrigTo), to = Math.max(D.irrigFrom, D.irrigTo);
    return DAYS_IN_MONTH.map((days, i) => {
      let v = daily * days;
      if (D.irrigArea > 0 && i >= from && i <= to) v += D.irrigArea * D.irrigMM * (days / 7);
      return v;
    });
  }

  function inflowMonthly(model, geom) {
    const wd = wetDays(model);
    const ff = Math.max(0, model.system.firstFlush);
    const fc = clamp(model.system.filterCoef, 0, 1);
    return model.climate.monthly.map((mm, i) => {
      const effective = Math.max(0, mm - ff * wd[i]);      // first flush diverted per event
      /* per-block so mixed roof materials keep their own yield coefficient */
      return sum(geom.per.map(p => p.proj * effective * p.yc * fc));
    });
  }

  /* YAS water balance. Returns end-of-step series plus totals.
     Three warm-up cycles run first so the answer does not depend on the
     assumed starting level. */
  function balance(model, inflow, demand, capacity, wd) {
    const cap = Math.max(0, capacity);
    let level = 0;
    const daily = model.system.daily;
    const out = { level:[], supplied:[], overflow:[], deficit:[], inflow:inflow.slice(), demand:demand.slice(), dryDays:0, steps:0 };

    for (let cycle = 0; cycle < 4; cycle++) {
      const last = cycle === 3;
      if (last) { out.level.length = 0; out.supplied.length = 0; out.overflow.length = 0; out.deficit.length = 0; out.dryDays = 0; out.steps = 0; }
      for (let m = 0; m < 12; m++) {
        const n = daily ? DAYS_IN_MONTH[m] : 1;
        const perStepDemand = demand[m] / n;
        /* spread the month's inflow over its wet days, evenly spaced.
           Every step's inflow is placed exactly once, so volume is conserved. */
        const q = new Array(n).fill(0);
        if (daily) {
          const wet = clamp(wd[m], inflow[m] > 0 ? 1 : 0, n);
          if (wet > 0) {
            const perWet = inflow[m] / wet, stride = n / wet;
            for (let k = 0; k < wet; k++) q[Math.min(n - 1, Math.floor(k * stride))] += perWet;
          }
        } else q[0] = inflow[m];

        let mY = 0, mO = 0, mD = 0;
        for (let s = 0; s < n; s++) {
          const y = Math.min(perStepDemand, level);
          level -= y;
          level += q[s];
          const over = Math.max(0, level - cap);
          level -= over;
          mY += y; mO += over; mD += perStepDemand - y;
          if (last && perStepDemand > 0 && y < perStepDemand - 1e-9) out.dryDays++;
          if (last) out.steps++;
        }
        if (last) { out.level.push(level); out.supplied.push(mY); out.overflow.push(mO); out.deficit.push(mD); }
      }
    }
    out.totalSupplied    = sum(out.supplied);
    out.totalOverflow = sum(out.overflow);
    out.totalDeficit  = sum(out.deficit);
    out.totalDemand   = sum(demand);
    out.totalInflow   = sum(inflow);
    out.saving = out.totalDemand > 0 ? out.totalSupplied / out.totalDemand : 0;
    out.reliability = out.steps > 0 ? 1 - out.dryDays / out.steps : 0;
    return out;
  }

  /* indicative gutter / downpipe check (NOT a substitute for BS EN 12056-3) */
  const PIPE_CAP = [[63,1.7],[75,2.6],[90,4.3],[100,5.6],[110,7.2],[125,10.5],[150,16.0]];
  function drainageCheck(model, geom, intensity) {
    const i = intensity || 75;                       // mm/h design storm
    const Q = geom.catchment * i / 3600;             // litres/second
    const n = Math.max(1, sum(model.blocks.map(b => Math.max(1, b.downpipes))));
    const per = Q / n;
    const pick = PIPE_CAP.find(p => p[1] >= per) || PIPE_CAP[PIPE_CAP.length - 1];
    return { intensity: i, Q, n, per, dia: pick[0], ok: pick[1] >= per };
  }

  function compute(model, geom) {
    const wd = wetDays(model);
    const demand = demandMonthly(model);
    const inflow = inflowMonthly(model, geom);
    const annualRain = sum(model.climate.monthly);
    const annualInflow = sum(inflow);
    const annualDemand = sum(demand);

    /* Basic approach with annual time step — BS EN 16941-1:2024, A.2.1,
       Formulas (A.1) and (A.2): the useable capacity is the lesser of the annual
       yield and the annual demand, multiplied by the chosen dry period over 365.
       The standard gives 15 days (Netherlands), 18 (Ireland, UK), 21 (Germany).

       The UK National Annex, NA.3, adds: where the ratio of annual yield to
       annual demand falls below 0.5 or rises above 2.0, the dry period should be
       reduced — its worked suggestion is to halve it — because at those ratios
       the tank spends most of the year either empty or full. */
    const ydRatio = annualDemand > 0 ? annualInflow / annualDemand : Infinity;
    const naHalved = ydRatio < 0.5 || ydRatio > 2.0;
    const dryDays = Math.max(1, model.system.dryDays || 18) * (naHalved ? 0.5 : 1);
    const simple = Math.min(annualInflow, annualDemand) * (dryDays / 365);

    /* optimisation sweep: water-saving efficiency against capacity */
    const capMax = Math.max(simple * 6, annualDemand / 365 * 60, 1000);
    const sweep = [];
    const STEPS = 36;
    for (let k = 0; k <= STEPS; k++) {
      const cap = (capMax * k) / STEPS;
      sweep.push({ cap, saving: balance(model, inflow, demand, cap, wd).saving });
    }
    const best = sweep[sweep.length - 1].saving;
    const knee = (sweep.find(s => s.saving >= best * 0.95) || sweep[sweep.length - 1]).cap;

    const capacity = model.system.tankMode === "auto" ? simple : Math.max(0, model.system.tank);
    const bal = balance(model, inflow, demand, capacity, wd);

    const mainsSaved = bal.totalSupplied / 1000;                    // m3
    return {
      wd, demand, inflow, annualRain, annualInflow, annualDemand,
      simple, knee, sweep, capacity, bal, dryDays, ydRatio, naHalved,
      maxMonthDemand: Math.max(...demand),
      maxSaving: best,
      daysStorage: annualDemand > 0 ? capacity / (annualDemand / 365) : 0,
      mainsSaved, costSaved: mainsSaved * model.system.tariff,
      drain: drainageCheck(model, geom, 75),
      ycMean: geom.ycMean
    };
  }

  return { compute, balance, demandMonthly, inflowMonthly, wetDays };
})();

/* ═══════════════════════════ R3D ═══════════════════════════
   Canvas 2D renderer. Deliberately not WebGL:
     · vector output, so PNG and the A3 report re-render the same scene at 3-4x
       device scale instead of upscaling a screen-resolution framebuffer;
     · hidden-line and x-ray styles fall out of the painter's algorithm;
     · no context-loss or sandbox failure modes on classroom machines.
   Painter's algorithm is exact for this geometry class because block footprints
   are prevented from overlapping in plan.
   ========================================================================== */

const R3D = (() => {

  const cam = { az: -37 * D2R, el: 24 * D2R, dist: 46, target: [0, 3, 0], fov: 36 * D2R };
  const LIGHT = (() => { const v = [-0.42, 0.84, 0.34]; const L = Math.hypot(...v); return v.map(c => c / L); })();

  let theme = null;
  let sysCache = { key: null, prims: [] };
  function palette(force) {
    if (theme && !force) return theme;
    const cs = getComputedStyle(document.getElementById("rwc-app"));
    const g = n => cs.getPropertyValue(n).trim();
    theme = {
      grid: g("--scene-grid"), grid2: g("--scene-grid-2"), edge: g("--scene-edge"),
      ink: g("--ink"), ink2: g("--ink-2"), ink3: g("--ink-3"),
      surface: g("--surface-1"), line: g("--line"), accent: g("--accent"),
      s1: g("--series-1"), s2: g("--series-2"), s3: g("--series-3"),
      bg1: g("--scene-bg-a"), bg2: g("--scene-bg-b"), warn: g("--warn"),
      seq: [g("--seq-100"), g("--seq-200"), g("--seq-300"), g("--seq-400"), g("--seq-500"), g("--seq-600"), g("--seq-700")]
    };
    return theme;
  }
  const invalidateTheme = () => { theme = null; };

  /* --- camera ---------------------------------------------------------- */

  function basis() {
    const ce = Math.cos(cam.el), se = Math.sin(cam.el);
    const dir = [ce * Math.sin(cam.az), se, ce * Math.cos(cam.az)];
    const eye = [cam.target[0] + dir[0] * cam.dist, cam.target[1] + dir[1] * cam.dist, cam.target[2] + dir[2] * cam.dist];
    const fwd = [-dir[0], -dir[1], -dir[2]];
    let right = [-fwd[2], 0, fwd[0]];            // fwd × worldUp
    const rl = Math.hypot(right[0], right[2]) || 1;
    right = [right[0] / rl, 0, right[2] / rl];
    const up = [
      right[1] * fwd[2] - right[2] * fwd[1],
      right[2] * fwd[0] - right[0] * fwd[2],
      right[0] * fwd[1] - right[1] * fwd[0]
    ];
    return { eye, fwd, right, up };
  }

  function makeProjector(W, H) {
    const b = basis();
    const f = (H / 2) / Math.tan(cam.fov / 2);
    const cx = W / 2, cy = H / 2;
    return p => {
      const dx = p[0] - b.eye[0], dy = p[1] - b.eye[1], dz = p[2] - b.eye[2];
      const z = dx * b.fwd[0] + dy * b.fwd[1] + dz * b.fwd[2];
      if (z < 0.15) return null;
      const x = dx * b.right[0] + dy * b.right[1] + dz * b.right[2];
      const y = dx * b.up[0] + dy * b.up[1] + dz * b.up[2];
      return [cx + (f * x) / z, cy - (f * y) / z, z];
    };
  }

  function fit(bounds, W, H) {
    const c = [0, 1, 2].map(i => (bounds.min[i] + bounds.max[i]) / 2);
    const size = [0, 1, 2].map(i => bounds.max[i] - bounds.min[i]);
    const r = Math.max(1.5, Math.hypot(size[0], size[1], size[2]) / 2);
    cam.target = [c[0], c[1], c[2]];
    const aspect = Math.max(0.35, W / Math.max(1, H));
    const vfov = cam.fov, hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    cam.dist = clamp(r / Math.sin(Math.min(vfov, hfov) / 2) * 1.16, 4, 4000);
  }

  const VIEWS = {
    iso:   { az: -37 * D2R, el:  24 * D2R },
    top:   { az:   0 * D2R, el:  89 * D2R },
    front: { az:   0 * D2R, el:   6 * D2R },
    back:  { az: 180 * D2R, el:   6 * D2R },
    right: { az:  90 * D2R, el:   6 * D2R },
    left:  { az: -90 * D2R, el:   6 * D2R }
  };
  function setView(k) { const v = VIEWS[k]; if (v) { cam.az = v.az; cam.el = v.el; } }

  /* --- small solid helpers --------------------------------------------- */

  function boxFaces(cx, cy, cz, sx, sy, sz, kind, col) {
    const X = sx / 2, Y = sy / 2, Z = sz / 2;
    const v = [
      [cx-X,cy-Y,cz-Z],[cx+X,cy-Y,cz-Z],[cx+X,cy-Y,cz+Z],[cx-X,cy-Y,cz+Z],
      [cx-X,cy+Y,cz-Z],[cx+X,cy+Y,cz-Z],[cx+X,cy+Y,cz+Z],[cx-X,cy+Y,cz+Z]
    ];
    const q = [[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]];
    return q.map(ix => {
      const pts = ix.map(i => v[i]);
      let nx=0,ny=0,nz=0;
      for (let i=0;i<pts.length;i++){const a=pts[i],b2=pts[(i+1)%pts.length];
        nx+=(a[1]-b2[1])*(a[2]+b2[2]); ny+=(a[2]-b2[2])*(a[0]+b2[0]); nz+=(a[0]-b2[0])*(a[1]+b2[1]);}
      const L = Math.hypot(nx,ny,nz)||1;
      return { pts, kind, col, normal:[nx/L,ny/L,nz/L],
               centroid:[(pts[0][0]+pts[2][0])/2,(pts[0][1]+pts[2][1])/2,(pts[0][2]+pts[2][2])/2] };
    });
  }

  function segBox(a, b, w, h, kind, col) {
    const dx = b[0]-a[0], dz = b[2]-a[2], L = Math.hypot(dx,dz);
    if (L < 1e-4) return [];
    const cx = (a[0]+b[0])/2, cz = (a[2]+b[2])/2, cy = (a[1]+b[1])/2;
    if (Math.abs(dx) >= Math.abs(dz)) return boxFaces(cx, cy, cz, L, h, w, kind, col);
    return boxFaces(cx, cy, cz, w, h, L, kind, col);
  }

  /* --- colour selection ------------------------------------------------ */

  function shadeHex(hex, k) {
    const h = hex.replace("#",""); const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
    const r = clamp(Math.round(((n>>16)&255)*k),0,255), g = clamp(Math.round(((n>>8)&255)*k),0,255), b = clamp(Math.round((n&255)*k),0,255);
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function withAlpha(hex, a) {
    const h = hex.replace("#",""); const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }
  const WALL_COL = "#c9c6bd", PARAPET_COL = "#bab7ae", GLAZE_COL = "#9fc4d8";

  function faceColour(f, style, P, selected) {
    const mat = MATERIALS[f.material];
    let base = f.col || (f.kind === "roof" ? (mat ? mat.col : "#a8593f")
              : f.kind === "glazing" ? GLAZE_COL
              : f.kind === "parapet" ? PARAPET_COL : WALL_COL);
    if (style === "catchment") {
      if (f.kind === "roof" && mat) {
        const t = clamp((mat.yc - 0.35) / 0.6, 0, 1);
        base = P.seq[clamp(Math.round(1 + t * 5), 0, 6)];
        return { fill: base, stroke: withAlpha(P.edge, 0.35), lw: 0.8 };
      }
      return { fill: withAlpha(P.ink3, 0.16), stroke: withAlpha(P.ink3, 0.35), lw: 0.7 };
    }
    const ndl = Math.abs(f.normal[0]*LIGHT[0] + f.normal[1]*LIGHT[1] + f.normal[2]*LIGHT[2]);
    const k = 0.46 + 0.54 * ndl;
    if (style === "wire")   return { fill: null, stroke: withAlpha(P.edge, 0.55), lw: 0.9 };
    if (style === "hidden") return { fill: P.surface, stroke: P.edge, lw: 1.0 };
    if (style === "xray")   return { fill: withAlpha(base, 0.16), stroke: withAlpha(P.edge, 0.5), lw: 0.8 };
    const fill = shadeHex(base, k);
    return {
      fill, lw: selected ? 1.5 : 0.85,
      stroke: selected ? P.accent : withAlpha(P.edge, style === "flow" ? 0.22 : 0.3)
    };
  }

  /* --- the render ------------------------------------------------------ */

  function render(ctx, W, H, model, geom, res, opts) {
    opts = opts || {};
    const P = palette();
    const style = model.view.style;
    const proj = makeProjector(W, H);
    const b = basis();
    const scale = opts.scale || 1;
    const selected = opts.selected;
    let tankLabel = null;

    /* backdrop */
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, opts.bg1 || P.bg1);
    grad.addColorStop(1, opts.bg2 || P.bg2);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    /* ground grid, drawn first: nothing in the scene goes below y = 0 */
    if (model.view.grid) {
      const ext = Math.max(24, Math.ceil(Math.max(
        geom.bounds.max[0] - geom.bounds.min[0], geom.bounds.max[2] - geom.bounds.min[2]) * 0.9) + 10);
      const cx = Math.round((geom.bounds.min[0] + geom.bounds.max[0]) / 2);
      const cz = Math.round((geom.bounds.min[2] + geom.bounds.max[2]) / 2);
      ctx.lineWidth = 1 * scale;
      for (let i = -ext; i <= ext; i++) {
        const major = i % 5 === 0;
        ctx.strokeStyle = major ? P.grid2 : P.grid;
        ctx.globalAlpha = major ? 0.75 : 0.4;
        for (const axis of [0, 1]) {
          const a = axis ? proj([cx - ext, 0, cz + i]) : proj([cx + i, 0, cz - ext]);
          const c = axis ? proj([cx + ext, 0, cz + i]) : proj([cx + i, 0, cz + ext]);
          if (!a || !c) continue;
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    /* --- collect drawables ------------------------------------------------
       Opaque styles draw the tessellated triangles, so the depth sort is fine
       grained enough to be correct. Wire and x-ray are see-through, where sort
       inversions do not read, so they draw whole faces — faster, and it keeps
       the linework to real polygon edges. */
    const sysFaces = [];
    if (model.view.system) {
      const tankCol = P.s1;
      /* hang the gutter under the eave rather than straddling it: a box centred
         on the eave line interpenetrates the roof and cannot sort cleanly */
      for (const g of geom.drain.gutters) {
        const a = [g.a[0], g.a[1] - 0.14, g.a[2]], c = [g.b[0], g.b[1] - 0.14, g.b[2]];
        sysFaces.push(...segBox(a, c, 0.26, 0.20, "sys", tankCol));
      }
      for (const q of geom.drain.pipes)
        sysFaces.push(...boxFaces(q.x, q.top / 2, q.z, 0.16, q.top, 0.16, "sys", tankCol));
      if (res && res.capacity > 0) {
        const vol = res.capacity / 1000;                       // m3
        const hT = clamp(Math.cbrt(vol) * 1.15, 1.0, 4.0);
        const side = Math.sqrt(Math.max(0.4, vol / hT));
        const tx = geom.bounds.max[0] + side / 2 + 2.0;
        const tz = geom.bounds.max[2] + side / 2 + 2.0;
        sysFaces.push(...boxFaces(tx, hT / 2, tz, side, hT, side, "tank", tankCol));
        tankLabel = { p: [tx, hT + 0.35, tz], v: vol, side, h: hT };
      }
    }

    const solid = style !== "wire" && style !== "xray";
    let items;
    if (solid) {
      const key = geom.uid + "|" + (res ? Math.round(res.capacity) : 0) + "|" + sysFaces.length;
      if (sysCache.key !== key) {
        const out = [];
        for (const f of sysFaces) for (const t of GEO.tessellate(f, geom.maxEdge)) { t.f = f; out.push(t); }
        sysCache = { key, prims: out };
      }
      items = geom.prims.concat(sysCache.prims);
    } else {
      items = geom.faces.concat(sysFaces).map(f => ({
        f, p: f.pts, c: f.centroid,
        e: f.softEdge && f.softEdge.some(Boolean) ? f.softEdge.map(v => !v) : null
      }));
    }

    /* Painter's algorithm, on true distance so a bias can be expressed in metres.
       A wall meets the roof exactly along the eaves and, on a vault, along the
       whole arch of the gable end. Coincident surfaces have no correct order, so
       a wall triangle can land in front of a roof triangle and punch a wedge
       through the roof. Pushing walls fractionally further away breaks every one
       of those ties in the roof's favour, while leaving genuine occlusion
       (metres apart) untouched. */
    const eye = b.eye;
    const BIAS = { wall: 0.55, glazing: 0.12 };
    for (const it of items) {
      const c = it.c;
      it._d = Math.hypot(c[0]-eye[0], c[1]-eye[1], c[2]-eye[2]) + (BIAS[it.f.kind] || 0);
    }
    items.sort((a, z) => z._d - a._d);

    /* grow each opaque triangle by a fraction of a pixel so neighbours overlap:
       two abutting antialiased edges do not sum to full opacity, and without
       this every surface is crazed with pale hairlines */
    const GROW = 0.45 * scale;
    for (const it of items) {
      const sp = it.p.map(proj);
      if (sp.some(q => q === null)) continue;
      const f = it.f;
      const col = f.kind === "sys" || f.kind === "tank"
        ? (() => {
            const ndl = Math.abs(f.normal[0]*LIGHT[0] + f.normal[1]*LIGHT[1] + f.normal[2]*LIGHT[2]);
            return { fill: shadeHex(f.col, 0.5 + 0.5 * ndl), stroke: withAlpha(P.edge, 0.35), lw: 0.8 };
          })()
        : faceColour(f, style, P, selected && f.block === selected);
      /* a block overlapping another in plan is outlined in the warning colour,
         so a bad drop is obvious in the model space, not only in the status bar */
      if (geom.overlapIds.size && geom.overlapIds.has(f.block)) {
        col.stroke = P.warn; col.lw = 1.7;
      }

      if (col.fill) {
        let fp = sp;
        /* inflate only OPAQUE fills. Overlapping translucent triangles composite
           to a darker value, so growing them would craze the ghosted surfaces. */
        if (solid && col.fill.indexOf("rgba") !== 0) {
          const cx = (sp[0][0]+sp[1][0]+sp[2][0])/3, cy = (sp[0][1]+sp[1][1]+sp[2][1])/3;
          fp = sp.map(q => {
            const dx = q[0]-cx, dy = q[1]-cy, L = Math.hypot(dx, dy) || 1, k = (L + GROW) / L;
            return [cx + dx*k, cy + dy*k];
          });
        }
        ctx.beginPath();
        ctx.moveTo(fp[0][0], fp[0][1]);
        for (let i = 1; i < fp.length; i++) ctx.lineTo(fp[i][0], fp[i][1]);
        ctx.closePath();
        ctx.fillStyle = col.fill; ctx.fill();
      }

      if (col.stroke) {
        ctx.strokeStyle = col.stroke; ctx.lineWidth = col.lw * scale; ctx.lineJoin = "round";
        if (it.e) {                                  // real, creased edges only
          let any = false;
          ctx.beginPath();
          for (let k = 0; k < sp.length; k++) {
            if (!it.e[k]) continue;
            const a = sp[k], c2 = sp[(k + 1) % sp.length];
            ctx.moveTo(a[0], a[1]); ctx.lineTo(c2[0], c2[1]); any = true;
          }
          if (any) ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(sp[0][0], sp[0][1]);
          for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i][0], sp[i][1]);
          ctx.closePath(); ctx.stroke();
        }
      }
    }

    /* flow arrows: one per roof plane, not one per triangle, and only on planes
       that face the camera so they cannot show through the building */
    if (style === "flow") {
      /* A single arrow at each plane's centre means that on a large roof — or
         once you zoom in — there is often no arrow anywhere in view, which reads
         as the mode being broken. Tile arrows over each roof instead, on a
         world-aligned grid, so the fall direction is legible wherever you look.
         Each arrow is kept only where its own point is the frontmost surface on
         screen, which is winding-independent (a normal's sign is an artifact of
         vertex order) and also hides arrows on roofs behind another block. */
      const po = projectAll(geom.faces, proj);
      const spacing = clamp(geom.diag * 0.10, 1.2, 6);
      const len = spacing * 0.58;
      let budget = 160;

      const arrow = (a0, a1) => {
        const px = Math.hypot(a1[0]-a0[0], a1[1]-a0[1]);
        if (px < 10 * scale) return false;
        const ang = Math.atan2(a1[1]-a0[1], a1[0]-a0[0]);
        const hl = clamp(px * 0.30, 5 * scale, 13 * scale);
        const shaft = () => {
          ctx.beginPath();
          ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]);
          ctx.moveTo(a1[0], a1[1]);
          ctx.lineTo(a1[0] - hl*Math.cos(ang-0.42), a1[1] - hl*Math.sin(ang-0.42));
          ctx.moveTo(a1[0], a1[1]);
          ctx.lineTo(a1[0] - hl*Math.cos(ang+0.42), a1[1] - hl*Math.sin(ang+0.42));
          ctx.stroke();
        };
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        /* halo first, so an arrow reads on terracotta and on grey metal alike */
        ctx.strokeStyle = withAlpha(P.surface, 0.92); ctx.lineWidth = 5 * scale; shaft();
        ctx.strokeStyle = P.s1;                       ctx.lineWidth = 2.2 * scale; shaft();
        return true;
      };

      for (const f of geom.faces) {
        if (f.kind !== "roof" || budget <= 0) continue;
        /* flipped up, so +(nx,nz) is downhill */
        const n = f.normal[1] < 0 ? [-f.normal[0], -f.normal[1], -f.normal[2]] : f.normal;
        if (Math.abs(n[1]) < 0.05) continue;                  // effectively vertical
        let d = [n[0], 0, n[2]];
        const L = Math.hypot(d[0], d[2]);
        d = L < 1e-4 ? [0, 0, 1] : [d[0]/L, 0, d[2]/L];       // dead flat: fall to +z
        const drop = -(n[0]*d[0] + n[2]*d[2]) / n[1];
        const planeD = n[0]*f.pts[0][0] + n[1]*f.pts[0][1] + n[2]*f.pts[0][2];
        const yAtXZ = (x, z) => (planeD - n[0]*x - n[2]*z) / n[1];

        const poly2 = f.pts.map(q => [q[0], q[2]]);
        const xs = f.pts.map(q => q[0]), zs = f.pts.map(q => q[2]);
        const x0 = Math.min(...xs), x1 = Math.max(...xs);
        const z0 = Math.min(...zs), z1 = Math.max(...zs);

        const place = (x, z) => {
          if (budget <= 0) return false;
          const y = yAtXZ(x, z);
          const pt = [x, y, z];
          const mid = proj(pt);
          if (!mid || occluded(pt, mid[0], mid[1], f, eye, po)) return false;
          const a0 = proj([x - d[0]*len/2, y - drop*len/2, z - d[2]*len/2]);
          const a1 = proj([x + d[0]*len/2, y + drop*len/2, z + d[2]*len/2]);
          if (!a0 || !a1) return false;
          if (arrow(a0, a1)) { budget--; return true; }
          return false;
        };

        let drawn = 0;
        for (let z = Math.floor(z0 / spacing) * spacing + spacing / 2; z < z1 && budget > 0; z += spacing)
          for (let x = Math.floor(x0 / spacing) * spacing + spacing / 2; x < x1 && budget > 0; x += spacing) {
            if (!pointInPoly(x, z, poly2)) continue;
            if (place(x, z)) drawn++;
          }
        /* a face narrower than the grid (a vault strip) still gets one */
        if (!drawn) place(f.centroid[0], f.centroid[2]);
      }
    }

    /* scale figure + tank label + annotations */
    ctx.font = (11 * scale) + "px " + "-apple-system, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (model.view.dims) {
      const fx = geom.bounds.min[0] - 2.2, fz = geom.bounds.max[2] + 1.2;
      const fb = proj([fx, 0, fz]), ft = proj([fx, 1.75, fz]);
      if (fb && ft) drawFigure(ctx, fb[0], fb[1], Math.abs(fb[1] - ft[1]), P);
    }

    if (tankLabel) {
      const t = tankLabel, sp = proj(t.p);
      if (sp) {
        const txt = t.v >= 10 ? t.v.toFixed(0) + " m³ tank" : (t.v * 1000).toFixed(0) + " L tank";
        ctx.font = "600 " + (11.5 * scale) + "px -apple-system, Segoe UI, Roboto, sans-serif";
        const w = ctx.measureText(txt).width + 12 * scale;
        ctx.fillStyle = withAlpha(P.surface, 0.92);
        ctx.strokeStyle = withAlpha(P.edge, 0.25); ctx.lineWidth = 1 * scale;
        roundRect(ctx, sp[0]-w/2, sp[1]-11*scale, w, 19*scale, 5*scale); ctx.fill(); ctx.stroke();
        ctx.fillStyle = P.ink; ctx.fillText(txt, sp[0], sp[1] - 1.5*scale);
      }
    }

    /* north arrow + scale bar, screen space */
    if (model.view.dims) drawCompass(ctx, W, H, scale, P, proj, geom, b);
    return { proj, basis: b };
  }

  /* 1.75 m entourage figure, in units of body height with the feet at v = 0.
     Built from overlapping parts rather than one outline — a single outline has
     to run down the arm and back up into the armpit, and that self-intersection
     leaves slivers. The parts go into ONE path with their winding normalised, so
     a single non-zero fill unions them: filling them separately at alpha < 1
     would darken every overlap. */
  const FIG = {
    head:  [[0,0.995],[0.023,0.991],[0.039,0.974],[0.046,0.942],[0.045,0.907],[0.033,0.881],
            [0.014,0.869],[-0.014,0.869],[-0.033,0.881],[-0.045,0.907],[-0.046,0.942],
            [-0.039,0.974],[-0.023,0.991]],
    neck:  [[-0.027,0.880],[0.027,0.880],[0.033,0.836],[-0.033,0.836]],
    /* shoulders slope away from the neck base rather than sitting square */
    torso: [[-0.034,0.850],[0.034,0.850],[0.078,0.828],[0.100,0.795],[0.098,0.740],
            [0.072,0.630],[0.092,0.540],[0.086,0.465],[-0.086,0.465],[-0.092,0.540],
            [-0.072,0.630],[-0.098,0.740],[-0.100,0.795],[-0.078,0.828]],
    /* the top two vertices sit ON the torso's shoulder slope, so the arm cannot
       poke above it and nick the outline; the inner edge stays well inside the
       torso side so the arm always reads as attached */
    arm:   [[0.070,0.822],[0.100,0.793],[0.112,0.752],[0.108,0.640],[0.100,0.510],
            [0.096,0.425],[0.088,0.404],[0.068,0.406],[0.070,0.470],[0.066,0.560],[0.064,0.680]],
    leg:   [[0.010,0.470],[0.092,0.470],[0.084,0.350],[0.070,0.265],[0.066,0.180],
            [0.044,0.050],[0.072,0.000],[0.016,0.000],[0.024,0.052],[0.030,0.180],
            [0.036,0.265],[0.030,0.350]]
  };

  /* consistent winding, so the non-zero fill unions the parts instead of
     punching holes where they overlap */
  const FIG_PARTS = (() => {
    const norm = pts => {
      let a = 0;
      for (let i = 0; i < pts.length; i++) {
        const q = pts[i], r = pts[(i + 1) % pts.length];
        a += q[0] * r[1] - r[0] * q[1];
      }
      return a < 0 ? pts.slice().reverse() : pts;
    };
    const mirror = pts => pts.map(q => [-q[0], q[1]]);
    return [FIG.torso, FIG.neck, FIG.leg, mirror(FIG.leg), FIG.arm, mirror(FIG.arm), FIG.head]
      .map(norm);
  })();

  function drawFigure(ctx, cx, baseY, hpx, P) {
    if (!(hpx > 14)) return;                    // below this it is only a smudge
    ctx.save();
    ctx.fillStyle = withAlpha(P.ink, 0.13);     // contact shadow
    ctx.beginPath();
    ctx.ellipse(cx, baseY, hpx * 0.125, hpx * 0.024, 0, 0, 6.2832);
    ctx.fill();

    ctx.beginPath();
    for (const pts of FIG_PARTS) {
      ctx.moveTo(cx + pts[0][0] * hpx, baseY - pts[0][1] * hpx);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(cx + pts[i][0] * hpx, baseY - pts[i][1] * hpx);
      ctx.closePath();
    }
    ctx.fillStyle = withAlpha(P.ink2, 0.68);
    ctx.fill("nonzero");
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }

  function drawCompass(ctx, W, H, scale, P, proj, geom, b) {
    /* scale bar: 5 m measured along the camera's right vector, so it stays
       across the screen in plan and in every elevation */
    const c = [(geom.bounds.min[0]+geom.bounds.max[0])/2, 0, (geom.bounds.min[2]+geom.bounds.max[2])/2];
    const a = proj(c), bpt = proj([c[0]+b.right[0]*5, c[1]+b.right[1]*5, c[2]+b.right[2]*5]);
    const x0 = 16 * scale, y0 = H - 22 * scale;
    if (a && bpt) {
      const px = Math.hypot(bpt[0]-a[0], bpt[1]-a[1]) || 1;
      let metres = 5, len = px;
      while (len > W * 0.28) { metres /= 2; len = px * metres / 5; }
      while (len < W * 0.07 && metres < 500) { metres *= 2; len = px * metres / 5; }
      ctx.strokeStyle = withAlpha(P.ink2, 0.85); ctx.fillStyle = withAlpha(P.ink2, 0.85);
      ctx.lineWidth = 1.4 * scale;
      ctx.beginPath();
      ctx.moveTo(x0, y0-4*scale); ctx.lineTo(x0, y0); ctx.lineTo(x0+len, y0); ctx.lineTo(x0+len, y0-4*scale);
      ctx.moveTo(x0+len/2, y0); ctx.lineTo(x0+len/2, y0-3*scale);
      ctx.stroke();
      ctx.font = (10.5*scale)+"px -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText("0", x0-1*scale, y0+3*scale);
      ctx.textAlign = "right";
      ctx.fillText(metres + " m", x0+len+1*scale, y0+3*scale);
    }
    /* north arrow: north is -Z */
    const nc = [x0 + 14*scale, y0 - 40*scale];
    const o = proj([c[0], 0, c[2]]), n = proj([c[0], 0, c[2]-5]);
    if (o && n) {
      let dx = n[0]-o[0], dy = n[1]-o[1];
      const L = Math.hypot(dx, dy);
      if (L < 3 * scale) return;                  // north is edge-on: no readable needle
      dx/=L; dy/=L;
      const r = 13*scale;
      ctx.strokeStyle = withAlpha(P.ink2, 0.6); ctx.lineWidth = 1.2*scale;
      ctx.beginPath(); ctx.arc(nc[0], nc[1], r, 0, 6.284); ctx.stroke();
      ctx.fillStyle = withAlpha(P.ink, 0.85);
      ctx.beginPath();
      ctx.moveTo(nc[0]+dx*r*0.85, nc[1]+dy*r*0.85);
      ctx.lineTo(nc[0]-dy*r*0.34-dx*r*0.3, nc[1]+dx*r*0.34-dy*r*0.3);
      ctx.lineTo(nc[0]+dy*r*0.34-dx*r*0.3, nc[1]-dx*r*0.34-dy*r*0.3);
      ctx.closePath(); ctx.fill();
      ctx.font = "700 " + (9.5*scale) + "px -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("N", nc[0]+dx*r*1.62, nc[1]+dy*r*1.62);
    }
  }

  /* --- picking ---------------------------------------------------------- */

  /* faces sorted nearest-first, for "what is actually on top at this pixel" */
  function nearestFirst(faces, eye) {
    return faces.map(f => {
      const c = f.centroid;
      return { f, d: (c[0]-eye[0])**2 + (c[1]-eye[1])**2 + (c[2]-eye[2])**2 };
    }).sort((a, z) => a.d - z.d);
  }
  function faceAt(px, py, order, proj) {
    for (const it of order) {
      const sp = it.f.pts.map(proj);
      if (sp.some(q => q === null)) continue;
      if (pointInPoly(px, py, sp)) return it.f;
    }
    return null;
  }
  /* Project every face once, so hundreds of visibility samples cost only a
     point-in-polygon each. Order does not matter — occlusion is decided by an
     exact ray/plane intersection rather than by centroid depth, which is the
     same approximation that misorders large adjacent faces elsewhere. */
  function projectAll(faces, proj) {
    const out = [];
    for (const f of faces) {
      const sp = f.pts.map(proj);
      if (sp.some(q => q === null)) continue;
      out.push({ f, sp });
    }
    return out;
  }
  /* Is `pt` (which lies on face `self`) hidden from `eye` by any other face?
     Parameterise the ray as eye + t*(pt - eye); anything crossing at 0 < t < 1
     is strictly in front of the sample. */
  function occluded(pt, px, py, self, eye, po) {
    const ex = pt[0]-eye[0], ey = pt[1]-eye[1], ez = pt[2]-eye[2];
    for (const o of po) {
      if (o.f === self) continue;
      if (!pointInPoly(px, py, o.sp)) continue;
      const n = o.f.normal;
      const denom = n[0]*ex + n[1]*ey + n[2]*ez;
      if (Math.abs(denom) < 1e-9) continue;
      const q = o.f.pts[0];
      const t = (n[0]*(q[0]-eye[0]) + n[1]*(q[1]-eye[1]) + n[2]*(q[2]-eye[2])) / denom;
      if (t > 0.002 && t < 0.998) return true;
    }
    return false;
  }
  function pick(px, py, W, H, geom) {
    const f = faceAt(px, py, nearestFirst(geom.faces, basis().eye), makeProjector(W, H));
    return f ? f.block : null;
  }
  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  /* Inverse of the projector onto a horizontal plane — the ray from the eye
     through a pixel, intersected with y = y0. Returns null when the camera is
     too near horizontal for the hit to be meaningful. */
  function screenToGround(px, py, W, H, y0) {
    const b = basis();
    const f = (H / 2) / Math.tan(cam.fov / 2);
    const sx = px - W / 2, sy = H / 2 - py;
    const dir = [
      b.right[0]*sx + b.up[0]*sy + b.fwd[0]*f,
      b.right[1]*sx + b.up[1]*sy + b.fwd[1]*f,
      b.right[2]*sx + b.up[2]*sy + b.fwd[2]*f
    ];
    const L = Math.hypot(dir[0], dir[1], dir[2]) || 1;
    if (Math.abs(dir[1] / L) < 0.02) return null;          // grazing the ground
    const t = (y0 - b.eye[1]) / dir[1];
    if (t <= 0) return null;                                // plane is behind us
    return [b.eye[0] + dir[0]*t, y0, b.eye[2] + dir[2]*t];
  }

  /* the camera's right and forward directions flattened onto the ground, so a
     keyboard nudge moves the way the screen looks */
  function groundAxes() {
    const b = basis();
    const norm = v => { const L = Math.hypot(v[0], v[1]) || 1; return [v[0]/L, v[1]/L]; };
    return {
      right: norm([b.right[0], b.right[2]]),
      fwd:   norm([b.fwd[0],   b.fwd[2]])
    };
  }

  return { cam, render, fit, setView, pick, palette, invalidateTheme, makeProjector, VIEWS,
           screenToGround, groundAxes };
})();

/* ═══════════════════════════ FORMAT ═══════════════════════════ */

const nf = (v, d) => (isFinite(v) ? v : 0).toLocaleString(undefined, { minimumFractionDigits: d|0, maximumFractionDigits: d|0 });
function fmtVol(litres) {                       // litres -> L or m³, with a unit
  const v = isFinite(litres) ? litres : 0;
  if (Math.abs(v) >= 100000) return { v: nf(v/1000, 0), u: "m³" };
  if (Math.abs(v) >= 10000)  return { v: nf(v/1000, 1), u: "m³" };
  return { v: nf(v, 0), u: "L" };
}
const fmtPct = f => nf(clamp(f, 0, 1) * 100, 0) + "%";
/* format a group of volumes in ONE unit, so figures being compared side by side
   are directly comparable rather than switching between L and m3 mid-list */
function volSet(values) {
  const m3 = values.some(v => Math.abs(v) >= 10000);
  return v => m3 ? nf(v / 1000, Math.abs(v) >= 10000 ? 1 : 2) + " m³" : nf(v, 0) + " L";
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ═══════════════════════════ CHART ═══════════════════════════
   Hand-authored inline SVG: crisp at any size, prints cleanly, no dependency.
   Every chart carries a legend when it has 2+ series, direct labels on the
   points that matter, and a hover tooltip. The monthly table under the charts
   is the required relief for the series colours that sit below 3:1 on the
   light surface.
   ========================================================================== */

const CHART = (() => {
  const W = 520, H = 216, ML = 58, MR = 16, MT = 28, MB = 30;
  const PW = W - ML - MR, PH = H - MT - MB;

  function niceMax(v) {
    if (v <= 0) return 1;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const m = v / e;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e;
  }
  const axisLabel = v => Math.abs(v) >= 1000 ? nf(v/1000, v/1000 >= 10 ? 0 : 1) + "k" : nf(v, 0);

  function frame(yMax, yTitle, ticks) {
    ticks = ticks || 4;
    let g = "";
    for (let i = 0; i <= ticks; i++) {
      const y = MT + PH - (PH * i) / ticks;
      g += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${ML+PW}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"${i?' stroke-dasharray="2 3"':''}/>`;
      g += `<text x="${ML-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="13" fill="var(--ink-3)">${axisLabel((yMax*i)/ticks)}</text>`;
    }
    g += `<text x="0" y="${MT-11}" text-anchor="start" font-size="12" fill="var(--ink-3)">${esc(yTitle)}</text>`;
    return g;
  }
  function monthAxis() {
    let g = "";
    const bw = PW / 12;
    for (let i = 0; i < 12; i++)
      g += `<text x="${(ML + bw*i + bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="var(--ink-3)">${MONTHS[i][0]}</text>`;
    return g;
  }
  const tip = t => ` data-tip="${esc(t)}" tabindex="0"`;

  /* rounded top on a bar: 4px radius on the data end only, baseline square */
  function bar(x, y, w, h, fill, r, extra) {
    if (h <= 0.4) return "";
    const rr = Math.min(r === undefined ? 4 : r, w / 2, h);
    return `<path d="M${x.toFixed(1)},${(y+h).toFixed(1)} L${x.toFixed(1)},${(y+rr).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+rr).toFixed(1)},${y.toFixed(1)} L${(x+w-rr).toFixed(1)},${y.toFixed(1)} Q${(x+w).toFixed(1)},${y.toFixed(1)} ${(x+w).toFixed(1)},${(y+rr).toFixed(1)} L${(x+w).toFixed(1)},${(y+h).toFixed(1)} Z" fill="${fill}"${extra||""}/>`;
  }

  /* --- 1. monthly water balance: harvested + mains top-up, with inflow --- */
  function balance(res) {
    const d = res.bal;
    const yMax = niceMax(Math.max(...d.demand, ...d.inflow, 1) * 1.05);
    const bw = PW / 12, gap = Math.min(9, bw * 0.30), w = bw - gap;
    const Y = v => MT + PH - (v / yMax) * PH;
    let g = frame(yMax, "litres / month");

    for (let i = 0; i < 12; i++) {
      const x = ML + bw*i + gap/2;
      const hv = (d.supplied[i] / yMax) * PH, df = (d.deficit[i] / yMax) * PH;
      /* harvested at the baseline, mains stacked above, 2px surface gap between */
      g += bar(x, MT+PH-hv, w, hv, "var(--series-1)", df > 2 ? 0 : 4,
               tip(MONTHS[i] + " · harvested " + fmtVol(d.supplied[i]).v + " " + fmtVol(d.supplied[i]).u));
      if (df > 0.4)
        g += bar(x, MT+PH-hv-df-(hv>2?2:0), w, Math.max(0, df-(hv>2?2:0)), "var(--series-2)", 4,
                 tip(MONTHS[i] + " · mains top-up " + fmtVol(d.deficit[i]).v + " " + fmtVol(d.deficit[i]).u));
    }
    /* rainfall inflow as a line over the bars */
    let pts = [];
    for (let i = 0; i < 12; i++) pts.push([ML + bw*i + bw/2, Y(d.inflow[i])]);
    g += `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--surface-1)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;
    g += `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--series-3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    let peak = 0; for (let i = 1; i < 12; i++) if (d.inflow[i] > d.inflow[peak]) peak = i;
    for (let i = 0; i < 12; i++)
      g += `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${i===peak?4.5:3}" fill="var(--series-3)" stroke="var(--surface-1)" stroke-width="2"${tip(MONTHS[i] + " · roof inflow " + fmtVol(d.inflow[i]).v + " " + fmtVol(d.inflow[i]).u)}/>`;
    g += `<text x="${clamp(pts[peak][0], ML+22, ML+PW-22).toFixed(1)}" y="${Math.max(MT+9, pts[peak][1]-9).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink-2)" stroke="var(--surface-1)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${fmtVol(d.inflow[peak]).v} ${fmtVol(d.inflow[peak]).u}</text>`;
    return g + monthAxis();
  }

  /* --- 2. storage behaviour: tank level against capacity ------------------ */
  function store(res) {
    const d = res.bal, cap = res.capacity;
    const yMax = niceMax(Math.max(cap, ...d.level, 1) * 1.12);
    const bw = PW / 12;
    const Y = v => MT + PH - (v / yMax) * PH;
    let g = frame(yMax, "litres stored");
    const pts = d.level.map((v, i) => [ML + bw*i + bw/2, Y(v)]);
    g += `<path d="M${pts[0][0].toFixed(1)},${(MT+PH).toFixed(1)} ${pts.map(p=>"L"+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")} L${pts[11][0].toFixed(1)},${(MT+PH).toFixed(1)} Z" fill="var(--series-1)" opacity=".14"/>`;
    g += `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
    const cy = Y(cap);
    g += `<line x1="${ML}" y1="${cy.toFixed(1)}" x2="${ML+PW}" y2="${cy.toFixed(1)}" stroke="var(--ink-2)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
    g += `<text x="${ML+PW}" y="${(cy-5).toFixed(1)}" text-anchor="end" font-size="12.5" font-weight="600" fill="var(--ink-2)" stroke="var(--surface-1)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">capacity ${fmtVol(cap).v} ${fmtVol(cap).u}</text>`;
    let lo = 0; for (let i = 1; i < 12; i++) if (d.level[i] < d.level[lo]) lo = i;
    for (let i = 0; i < 12; i++)
      g += `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${i===lo?4.5:3}" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"${tip(MONTHS[i] + " · end of month " + fmtVol(d.level[i]).v + " " + fmtVol(d.level[i]).u)}/>`;
    g += `<text x="${clamp(pts[lo][0], ML+20, ML+PW-20).toFixed(1)}" y="${Math.min(MT+PH-6, pts[lo][1]+15).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink-2)" stroke="var(--surface-1)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">low ${fmtVol(d.level[lo]).v} ${fmtVol(d.level[lo]).u}</text>`;
    return g + monthAxis();
  }

  /* --- 3. capacity optimisation curve ---------------------------------- */
  function sweep(res) {
    const s = res.sweep;
    const xMax = s[s.length-1].cap || 1;
    const yMax = 1;
    const X = v => ML + (v / xMax) * PW;
    const Y = v => MT + PH - (v / yMax) * PH;
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const y = MT + PH - (PH*i)/4;
      g += `<line x1="${ML}" y1="${y}" x2="${ML+PW}" y2="${y}" stroke="var(--line)" stroke-width="1"${i?' stroke-dasharray="2 3"':''}/>`;
      g += `<text x="${ML-7}" y="${y+3.5}" text-anchor="end" font-size="13" fill="var(--ink-3)">${i*25}%</text>`;
    }
    g += `<text x="0" y="${MT-11}" text-anchor="start" font-size="12" fill="var(--ink-3)">demand met</text>`;
    g += `<polyline points="${s.map(p => X(p.cap).toFixed(1)+","+Y(p.saving).toFixed(1)).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
    const placed = [];
    for (const mk of [
      { cap: res.knee,     col: "var(--series-3)", lab: "knee (95% of max)" },
      { cap: res.capacity, col: "var(--series-2)", lab: "this design" }
    ]) {
      if (!(mk.cap > 0) || mk.cap > xMax) continue;
      const near = s.reduce((a, p) => Math.abs(p.cap-mk.cap) < Math.abs(a.cap-mk.cap) ? p : a, s[0]);
      const x = X(mk.cap), y = Y(near.saving);
      g += `<line x1="${x.toFixed(1)}" y1="${MT+PH}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${mk.col}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${mk.col}" stroke="var(--surface-1)" stroke-width="2"${tip(mk.lab + " · " + fmtVol(mk.cap).v + " " + fmtVol(mk.cap).u + " → " + fmtPct(near.saving))}/>`;
      /* stagger the label when the two markers land close together */
      const lx = clamp(x, ML + 34, ML + PW - 34);
      const clash = placed.some(q => Math.abs(q - lx) < 70);
      const ly = clamp(y - (clash ? 26 : 11), MT + 12, MT + PH - 6);
      placed.push(lx);
      g += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${mk.col}" stroke="var(--surface-1)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${esc(mk.lab.split(" ")[0])} ${fmtVol(mk.cap).v}${fmtVol(mk.cap).u}</text>`;
    }
    for (let i = 0; i <= 4; i++) {
      const v = (xMax*i)/4;
      g += `<text x="${X(v).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="var(--ink-3)">${axisLabel(v)}</text>`;
    }
    g += `<text x="${ML+PW}" y="${H-9}" text-anchor="end" font-size="12" fill="var(--ink-3)" opacity="0">L</text>`;
    return g;
  }

  /* --- 4. monthly rainfall (single series, no legend needed) ------------ */
  function rainfall(monthly) {
    const yMax = niceMax(Math.max(...monthly, 1) * 1.08);
    const bw = PW / 12, gap = Math.min(9, bw*0.32), w = bw - gap;
    let g = frame(yMax, "mm");
    for (let i = 0; i < 12; i++) {
      const h = (monthly[i] / yMax) * PH;
      g += bar(ML + bw*i + gap/2, MT+PH-h, w, h, "var(--series-1)", 4, tip(MONTHS[i] + " · " + nf(monthly[i],0) + " mm"));
    }
    return g + monthAxis();
  }

  const wrap = inner => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`;
  return { balance, store, sweep, rainfall, wrap, W, H };
})();
