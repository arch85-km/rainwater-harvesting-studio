<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainwater Harvesting Studio — Parametric Design Tool</title>
<meta name="description" content="Parametric 3D modeller that calculates rainwater harvesting yield, tank size and reliability to BS EN 16941-1. For architecture teaching.">
<link rel="canonical" href="https://karam.me.uk/applications/rainwater-harvesting-studio/">
<style>
/* ==========================================================================
   Rainwater Harvesting Studio
   All styles scoped under #rwc-app so a host theme (WordPress) cannot bleed in.
   ========================================================================== */

#rwc-app, #rwc-app *, #rwc-app *::before, #rwc-app *::after { box-sizing: border-box; }

#rwc-app {
  /* --- surfaces & ink (light) --- */
  --bg:            #f4f4f1;
  --surface-1:     #fcfcfb;
  --surface-2:     #f0efec;
  --surface-3:     #e6e5e1;
  --line:          #d7d6d1;
  --line-strong:   #b9b8b2;
  --ink:           #14140f;
  --ink-2:         #52514e;
  --ink-3:         #85847e;

  /* --- categorical series (validated: slots 1-3, all-pairs, both modes) --- */
  --series-1:      #2a78d6;   /* harvested rainwater */
  --series-2:      #eb6834;   /* mains top-up / deficit */
  --series-3:      #1baf7a;   /* overflow / spill */
  --accent:        #2a78d6;
  --accent-ink:    #ffffff;
  --warn:          #b8541f;
  --good:          #0f7a52;

  /* --- sequential blue ramp (catchment map, magnitude) --- */
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5;
  --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;

  /* --- 3D scene --- */
  --scene-bg-a:    #eceeef;
  --scene-bg-b:    #dfe3e6;
  --scene-grid:    #c8ccce;
  --scene-grid-2:  #b0b5b8;
  --scene-edge:    #1d2226;

  --radius:  7px;
  --radius-s:5px;
  --pad:     12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  color-scheme: light;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* dark values: declared under BOTH the OS media query and the explicit stamp,
   so the in-app toggle wins in either direction. */
@media (prefers-color-scheme: dark) {
  #rwc-app:where(:not([data-theme="light"])) {
    --bg:#131513; --surface-1:#1a1c1a; --surface-2:#232624; --surface-3:#2d312e;
    --line:#383c39; --line-strong:#4d524e; --ink:#f2f3f1; --ink-2:#b9bcb7; --ink-3:#878a86;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --accent:#3987e5; --accent-ink:#ffffff; --warn:#e08a5a; --good:#3fc596;
    --scene-bg-a:#1b1f22; --scene-bg-b:#101315;
    --scene-grid:#2c3236; --scene-grid-2:#3d4448; --scene-edge:#e8ecef;
    color-scheme: dark;
  }
}
#rwc-app[data-theme="dark"] {
  --bg:#131513; --surface-1:#1a1c1a; --surface-2:#232624; --surface-3:#2d312e;
  --line:#383c39; --line-strong:#4d524e; --ink:#f2f3f1; --ink-2:#b9bcb7; --ink-3:#878a86;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --accent:#3987e5; --accent-ink:#ffffff; --warn:#e08a5a; --good:#3fc596;
  --scene-bg-a:#1b1f22; --scene-bg-b:#101315;
  --scene-grid:#2c3236; --scene-grid-2:#3d4448; --scene-edge:#e8ecef;
  color-scheme: dark;
}

/* ---------- page shell ---------- */
html, body { margin:0; padding:0; }
body.rwc-standalone { background: var(--bg); overflow: hidden; }

#rwc-app {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  grid-template-columns: 232px minmax(0, 1fr) 320px;
  grid-template-areas:
    "bar   bar   bar"
    "tree  view  props"
    "kpi   kpi   kpi"
    "foot  foot  foot";
  height: 100dvh;
  min-height: 480px;
  width: 100%;
  overflow: hidden;
}
#rwc-app.rwc-embed { height: 100%; }

/* ---------- toolbar ---------- */
.rwc-bar {
  grid-area: bar;
  min-width: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 7px 10px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--line);
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: thin;
}
.rwc-bar::-webkit-scrollbar { height: 4px; }
.rwc-bar::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }
.rwc-brand {
  display:flex; align-items:center; gap:8px;
  padding-right: 12px; margin-right: 6px;
  border-right: 1px solid var(--line);
  flex: 0 0 auto;
}
.rwc-brand-mark {
  width: 26px; height: 26px; border-radius: 6px;
  background: linear-gradient(150deg, var(--series-1), var(--seq-600));
  display:grid; place-items:center; flex:0 0 auto;
}
.rwc-brand-mark svg { width:16px; height:16px; fill:#fff; }
.rwc-brand-txt { line-height:1.1; }
.rwc-brand-txt b { display:block; font-size:13px; letter-spacing:-.01em; }
.rwc-brand-txt span { display:block; font-size:10px; color: var(--ink-3); letter-spacing:.04em; text-transform:uppercase; }

.rwc-sep { width:1px; align-self:stretch; background: var(--line); margin: 0 6px; flex:0 0 auto; }
.rwc-spacer { flex: 1 1 auto; min-width: 4px; }

.rwc-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding: 6px 10px;
  font: inherit; font-size: 12.5px;
  color: var(--ink);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-s);
  cursor: pointer;
  white-space: nowrap;
  flex: 0 0 auto;
}
.rwc-btn:hover { background: var(--surface-2); border-color: var(--line); }
.rwc-btn:active { background: var(--surface-3); }
.rwc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rwc-btn[aria-expanded="true"] { background: var(--surface-3); border-color: var(--line-strong); }
.rwc-btn.rwc-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rwc-btn.rwc-primary:hover { filter: brightness(1.08); background: var(--accent); }
.rwc-btn svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
.rwc-btn .rwc-caret { width:9px; height:9px; opacity:.6; stroke-width:2.2; }
.rwc-icon-btn { padding:6px; }

/* ---------- menus ---------- */
/* Menus live inside #rwc-app so the design tokens resolve, and are fixed so
   #rwc-app's overflow:hidden cannot clip them. The literal fallbacks are a
   belt-and-braces guard: a menu must never be able to render transparent. */
.rwc-menu {
  position: fixed; z-index: 200;
  min-width: 210px; max-height: 70vh; overflow-y:auto;
  padding: 5px;
  background: var(--surface-1, #fcfcfb);
  color: var(--ink, #14140f);
  border: 1px solid var(--line-strong, #b9b8b2);
  border-radius: var(--radius, 7px);
  box-shadow: 0 10px 30px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
}
.rwc-menu[hidden] { display:none; }
.rwc-menu-item {
  display:flex; align-items:center; gap:9px; width:100%;
  padding: 7px 9px; border:0; border-radius: var(--radius-s, 5px);
  background:transparent; color:var(--ink, #14140f); font: inherit; font-size:12.5px;
  text-align:left; cursor:pointer;
}
.rwc-menu-item:hover { background: var(--surface-2); }
.rwc-menu-item:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.rwc-menu-item small { display:block; color: var(--ink-3); font-size:11px; line-height:1.3; }
.rwc-menu-item .rwc-mi-txt { flex:1 1 auto; min-width:0; }
.rwc-menu-item[aria-checked="true"]::after { content:"✓"; color: var(--accent); font-weight:700; }
.rwc-menu-head {
  padding: 8px 9px 4px; font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; color: var(--ink-3); font-weight:600;
}
.rwc-menu-div { height:1px; background: var(--line); margin:5px 3px; }

/* ---------- panels ---------- */
.rwc-tree  { grid-area: tree;  border-right: 1px solid var(--line); }
.rwc-props { grid-area: props; border-left: 1px solid var(--line); }
.rwc-tree, .rwc-props {
  background: var(--surface-1);
  display:flex; flex-direction:column;
  overflow: hidden;
  min-height: 0; min-width: 0;
}
.rwc-panel-head {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding: 9px 12px; flex:0 0 auto;
  font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line);
}
.rwc-panel-body { flex:1 1 auto; overflow-y:auto; overscroll-behavior: contain; }
.rwc-panel-body::-webkit-scrollbar { width:8px; }
.rwc-panel-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius:4px; }

/* tabs */
.rwc-tabs { display:flex; gap:1px; padding: 0 6px; background: var(--surface-2); border-bottom:1px solid var(--line); flex:0 0 auto; overflow-x:auto; scrollbar-width:none; }
.rwc-tabs::-webkit-scrollbar { display:none; }
.rwc-tab {
  padding: 8px 9px; border:0; background:transparent; cursor:pointer;
  font: inherit; font-size:11.5px; font-weight:500; color: var(--ink-3);
  border-bottom: 2px solid transparent; white-space:nowrap;
}
.rwc-tab:hover { color: var(--ink); }
.rwc-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rwc-tab:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
.rwc-tabpanel { padding: 12px; }
.rwc-tabpanel[hidden] { display:none; }

/* form controls */
.rwc-group { margin-bottom: 16px; }
.rwc-group:last-child { margin-bottom: 4px; }
.rwc-group-title {
  font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color: var(--ink-3); margin: 0 0 8px;
  display:flex; align-items:center; gap:6px;
}
.rwc-group-title::after { content:""; flex:1 1 auto; height:1px; background: var(--line); }

.rwc-field { margin-bottom: 10px; }
.rwc-field-row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:3px; }
.rwc-label { font-size:12px; color: var(--ink-2); }
.rwc-unit { font-size:11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rwc-slider-row { display:flex; align-items:center; gap:8px; }

#rwc-app input[type="range"] {
  flex:1 1 auto; min-width:0; height: 18px; margin:0;
  -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;
}
#rwc-app input[type="range"]::-webkit-slider-runnable-track { height:3px; border-radius:2px; background: var(--surface-3); }
#rwc-app input[type="range"]::-moz-range-track { height:3px; border-radius:2px; background: var(--surface-3); }
#rwc-app input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background: var(--accent); border:2px solid var(--surface-1); margin-top:-5.5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
#rwc-app input[type="range"]::-moz-range-thumb {
  width:12px; height:12px; border-radius:50%; background: var(--accent);
  border:2px solid var(--surface-1); box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
#rwc-app input[type="range"]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

#rwc-app input[type="number"], #rwc-app input[type="text"], #rwc-app select {
  font: inherit; font-size:12px; color: var(--ink);
  background: var(--surface-2);
  border:1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 5px 7px;
  width: 100%;
  min-width: 0;
}
#rwc-app input[type="number"] { width: 68px; flex:0 0 68px; text-align:right; font-variant-numeric: tabular-nums; }
#rwc-app select { cursor:pointer; }
#rwc-app input:focus-visible, #rwc-app select:focus-visible { outline:2px solid var(--accent); outline-offset:-1px; border-color: var(--accent); }
#rwc-app input[type="checkbox"] { accent-color: var(--accent); width:15px; height:15px; margin:0; flex:0 0 auto; cursor:pointer; }

.rwc-check { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; font-size:12px; color: var(--ink-2); }
.rwc-check:hover { color: var(--ink); }

.rwc-seg { display:flex; gap:2px; padding:2px; background: var(--surface-2); border:1px solid var(--line); border-radius: var(--radius-s); }
.rwc-seg button {
  flex:1 1 0; padding:5px 4px; border:0; border-radius:3px; background:transparent;
  font: inherit; font-size:11.5px; color: var(--ink-2); cursor:pointer; white-space:nowrap;
}
.rwc-seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.1); }
.rwc-seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

.rwc-note { font-size:11px; line-height:1.45; color: var(--ink-3); margin:6px 0 0; }
.rwc-note b { color: var(--ink-2); font-weight:600; }
.rwc-note.rwc-warn { color: var(--warn); }

/* roof type picker */
.rwc-roofgrid { display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; }
.rwc-roofgrid button {
  aspect-ratio: 1/.85; padding:4px 2px 3px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:1px solid var(--line); border-radius: var(--radius-s);
  background: var(--surface-2); cursor:pointer; color: var(--ink-2);
  font: inherit; font-size:9px; line-height:1;
}
.rwc-roofgrid button:hover { border-color: var(--line-strong); background: var(--surface-3); }
.rwc-roofgrid button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); color: var(--ink); font-weight:600; }
.rwc-roofgrid button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.rwc-roofgrid svg { width:100%; height:auto; max-height:26px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }

/* model tree */
.rwc-tree-list { padding:6px; }
.rwc-tree-item {
  display:flex; align-items:center; gap:7px; width:100%;
  padding:7px 8px; margin-bottom:2px;
  border:1px solid transparent; border-radius: var(--radius-s);
  background:transparent; color: var(--ink-2); font: inherit; font-size:12px;
  text-align:left; cursor:pointer;
}
.rwc-tree-item:hover { background: var(--surface-2); }
.rwc-tree-item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--ink); font-weight:600; }
.rwc-tree-item:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.rwc-tree-item .rwc-ti-name { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rwc-tree-item .rwc-ti-meta { font-size:10.5px; color: var(--ink-3); font-variant-numeric:tabular-nums; font-weight:400; }
.rwc-tree-item svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; flex:0 0 auto; opacity:.8; }
.rwc-tree-del { padding:3px; border:0; background:transparent; color: var(--ink-3); cursor:pointer; border-radius:3px; display:grid; place-items:center; }
.rwc-tree-del:hover { color: var(--warn); background: var(--surface-3); }
.rwc-tree-del svg { width:13px; height:13px; }

/* ---------- viewport ---------- */
.rwc-view {
  grid-area: view;
  position: relative;
  min-width: 0; min-height: 0;
  background: linear-gradient(180deg, var(--scene-bg-a), var(--scene-bg-b));
  overflow: hidden;
  touch-action: none;
}
.rwc-canvas { display:block; width:100%; height:100%; cursor: grab; }
.rwc-canvas.rwc-dragging { cursor: grabbing; }

.rwc-vp-tools {
  position:absolute; top:10px; left:10px; z-index:12;
  display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  max-width: calc(100% - 20px);
}
.rwc-vp-tools-r { left:auto; right:10px; align-items:flex-end; }
.rwc-chipbar {
  display:flex; gap:2px; padding:3px;
  background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border:1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
  flex-wrap: wrap;
}
.rwc-chip {
  padding:5px 8px; border:0; border-radius:4px; background:transparent;
  font: inherit; font-size:11px; color: var(--ink-2); cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.rwc-chip:hover { background: var(--surface-2); color: var(--ink); }
.rwc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight:600; }
.rwc-chip:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.rwc-chip svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

.rwc-readout {
  position:absolute; bottom:10px; right:10px; z-index:12;
  padding:7px 10px; font-size:11px; line-height:1.5; color: var(--ink-2);
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border:1px solid var(--line); border-radius: var(--radius);
  pointer-events:none; max-width: 60%;
}
.rwc-readout b { color: var(--ink); font-weight:600; }

.rwc-toast {
  position:absolute; bottom:62px; left:50%; transform:translateX(-50%) translateY(8px);
  z-index:40; padding:9px 14px; border-radius:20px; font-size:12.5px;
  background: var(--ink); color: var(--bg);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:0; transition: opacity .18s ease, transform .18s ease; pointer-events:none;
  max-width: 80%; text-align:center;
}
.rwc-toast.rwc-on { opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- KPI strip + charts ---------- */
.rwc-kpi {
  grid-area: kpi;
  background: var(--surface-1);
  border-top: 1px solid var(--line);
  display:flex; flex-direction:column;
  max-height: 46vh;
  min-width: 0;
}
.rwc-kpi-tiles {
  display:flex; gap:0; overflow-x:auto; scrollbar-width:thin;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  min-width: 0;
}
.rwc-tile {
  flex: 1 1 0; min-width: 132px;
  padding: 9px 14px;
  border-right: 1px solid var(--line);
  display:flex; flex-direction:column; gap:1px;
}
.rwc-tile:last-child { border-right:0; }
button.rwc-tile { border:0; border-right:1px solid var(--line); font:inherit; text-align:left; cursor:pointer; }
button.rwc-tile:hover { background: var(--surface-2); }
button.rwc-tile:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.rwc-tile-tag { font-size:9px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink-3); }
.rwc-tile.rwc-key { background: color-mix(in srgb, var(--accent) 9%, var(--surface-1)); }
.rwc-tile.rwc-key .rwc-tile-tag { color: var(--accent); }
.rwc-tile.rwc-key .rwc-tile-v { color: var(--accent); font-size:23px; }
.rwc-tile.rwc-key .rwc-tile-k { color: var(--ink); font-weight:600; }

/* explain sheet */
.rwc-ex-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:12px 14px; margin:0 0 16px; padding:0; list-style:none; }
@media (max-width:1080px){ .rwc-ex-steps { grid-template-columns:repeat(2,1fr); } }
@media (max-width:680px){ .rwc-ex-steps { grid-template-columns:1fr; } }
.rwc-ex-step { border:1px solid #ccc; border-radius:5px; padding:10px 12px; position:relative; }
.rwc-ex-step.rwc-key { border-color:#2a78d6; border-width:2px; background:rgba(42,120,214,.05); }
.rwc-ex-n { position:absolute; top:-9px; left:10px; background:#fff; padding:0 5px; font-size:10px; font-weight:700; color:#888; letter-spacing:.08em; }
.rwc-ex-step.rwc-key .rwc-ex-n { color:#2a78d6; }
.rwc-ex-tag { font-size:9px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:#888; }
.rwc-ex-step.rwc-key .rwc-ex-tag { color:#2a78d6; }
.rwc-ex-title { font-size:12.5px; font-weight:650; margin:1px 0 4px; }
.rwc-ex-val { font-size:19px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:0 0 3px; }
.rwc-ex-step.rwc-key .rwc-ex-val { color:#2a78d6; font-size:23px; }
.rwc-ex-sub { font-size:10.5px; color:#555; font-family:var(--mono); margin:0 0 5px; word-break:break-word; }
.rwc-ex-note { font-size:11px; line-height:1.45; color:#333; margin:0; }
.rwc-ex-box { border:2px solid #2a78d6; border-radius:6px; padding:13px 15px; margin:0 0 14px; background:rgba(42,120,214,.05); }
.rwc-ex-box h2 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin:0 0 6px; color:#2a78d6; }
.rwc-ex-box .rwc-ex-big { font-size:30px; font-weight:700; letter-spacing:-.02em; margin:0 0 5px; }
.rwc-ex-box p { font-size:12px; line-height:1.5; margin:0 0 6px; }
.rwc-ex-box p:last-child { margin-bottom:0; }
.rwc-ex-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.rwc-ex-list { list-style:none; padding:0; margin:0; }
.rwc-ex-list li { font-size:11.5px; line-height:1.5; padding:5px 0; border-bottom:1px solid #eee; }
.rwc-ex-list li:last-child { border-bottom:0; }
.rwc-ex-list b { display:inline-block; min-width:128px; }
.rwc-ex-warn { border-color:#b8541f; background:rgba(184,84,31,.05); }
.rwc-ex-warn h2 { color:#b8541f; }
@media (max-width:820px){ .rwc-ex-cols { grid-template-columns:1fr; } }
.rwc-tile-k { font-size:10px; letter-spacing:.05em; text-transform:uppercase; color: var(--ink-3); white-space:nowrap; }
.rwc-tile-v { font-size:19px; font-weight:650; letter-spacing:-.02em; font-variant-numeric: tabular-nums; line-height:1.15; }
.rwc-tile-v small { font-size:11px; font-weight:500; color: var(--ink-3); margin-left:2px; }
.rwc-tile-s { font-size:10.5px; color: var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rwc-tile.rwc-hl .rwc-tile-v { color: var(--accent); }

.rwc-charts { display:none; }
#rwc-app[data-mode="analysis"] .rwc-charts { display:block; }
.rwc-charts { flex:1 1 auto; overflow-y:auto; padding: 12px 14px 16px; min-width: 0; }
.rwc-chart-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(410px, 1fr)); gap:16px; }
.rwc-card { background: var(--surface-1); border:1px solid var(--line); border-radius: var(--radius); padding:12px 14px 10px; min-width:0; }
.rwc-card-title { font-size:12.5px; font-weight:650; margin:0 0 1px; letter-spacing:-.01em; }
.rwc-card-sub { font-size:11px; color: var(--ink-3); margin:0 0 10px; }
.rwc-card svg { display:block; width:100%; height:auto; overflow:visible; }

.rwc-legend { display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 0; font-size:11px; color: var(--ink-2); }
.rwc-legend span { display:inline-flex; align-items:center; gap:5px; }
.rwc-swatch { width:11px; height:11px; border-radius:2.5px; flex:0 0 auto; }

.rwc-table { width:100%; border-collapse:collapse; font-size:11.5px; font-variant-numeric: tabular-nums; }
.rwc-table th, .rwc-table td { padding:4px 7px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
.rwc-table th { color: var(--ink-3); font-weight:600; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; position:sticky; top:0; background: var(--surface-1); }
.rwc-table th:first-child, .rwc-table td:first-child { text-align:left; }
.rwc-table tfoot td { font-weight:650; border-top:2px solid var(--line-strong); border-bottom:0; }
.rwc-table-wrap { overflow:auto; max-height: 320px; margin-top:4px; }

.rwc-cmp-empty { font-size:11.5px; color: var(--ink-3); padding: 10px 0; }

/* ---------- footer ---------- */
.rwc-foot {
  grid-area: foot;
  min-width: 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding: 5px 14px;
  background: var(--surface-1);
  border-top: 1px solid var(--line);
  font-size:11px; color: var(--ink-3);
}
.rwc-copy { font-weight:500; color: var(--ink-2); white-space:nowrap; }
.rwc-foot-r { display:flex; gap:14px; align-items:center; overflow:hidden; }
.rwc-foot-r span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ---------- modes ---------- */
#rwc-app[data-mode="analysis"] { grid-template-columns: 0 minmax(0, 1fr) 320px; }
#rwc-app[data-mode="analysis"] .rwc-tree { display:none; }
#rwc-app[data-mode="analysis"] .rwc-kpi { max-height: 60vh; }
#rwc-app[data-mode="analysis"] { grid-template-rows: auto minmax(180px, 1fr) minmax(240px, 1.35fr) auto; }

#rwc-app[data-mode="present"] {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 1fr auto auto;
  grid-template-areas: "view" "kpi" "foot";
}
#rwc-app[data-mode="present"] .rwc-bar,
#rwc-app[data-mode="present"] .rwc-tree,
#rwc-app[data-mode="present"] .rwc-props,
#rwc-app[data-mode="present"] .rwc-vp-tools,
#rwc-app[data-mode="present"] .rwc-readout { display:none; }
#rwc-app[data-mode="present"] .rwc-tile-v { font-size: clamp(20px, 3.4vw, 40px); }
#rwc-app[data-mode="present"] .rwc-tile-k { font-size:11px; }
#rwc-app[data-mode="present"] .rwc-tile { padding: 14px 20px; }
#rwc-app[data-mode="present"] .rwc-view { background: linear-gradient(180deg, var(--scene-bg-a), var(--scene-bg-b)); }
.rwc-present-hud {
  position:absolute; top:0; left:0; right:0; z-index:14;
  display:none; align-items:flex-start; justify-content:space-between; gap:16px;
  padding: 20px 24px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--scene-bg-a) 92%, transparent), transparent);
  pointer-events:none;
}
#rwc-app[data-mode="present"] .rwc-present-hud { display:flex; }
.rwc-present-title { font-size: clamp(16px, 2.4vw, 26px); font-weight:650; letter-spacing:-.02em; margin:0; color: var(--ink); }
.rwc-present-sub { font-size: clamp(11px, 1.3vw, 14px); color: var(--ink-2); margin:3px 0 0; max-width: 60ch; }
.rwc-present-nav { pointer-events:auto; display:flex; gap:6px; align-items:center; }
.rwc-present-count { font-size:12px; color: var(--ink-3); font-variant-numeric:tabular-nums; padding:0 4px; }

/* ---------- report sheet (print) ---------- */
.rwc-report { display:none; }
@media print {
  html, body { background:#fff !important; height:auto !important; overflow:visible !important; }
  body > *:not(.rwc-report) { display:none !important; }
  .rwc-report { display:block !important; color:#000; font-family: var(--font); }

  /* On screen the sheet is a fixed, internally-scrolling overlay. A fixed
     element is clipped to ONE printed page, which silently dropped everything
     below the fold — undoing that here is what restores pagination. */
  .rwc-report.rwc-preview {
    position:static !important; inset:auto !important;
    height:auto !important; max-height:none !important;
    overflow:visible !important; padding:0 !important;
  }
  .rwc-rep-sheet { max-width:none !important; }
  .rwc-rep-bar { display:none !important; }

  /* never split a card, a legend or a table row across the page break */
  .rwc-ex-step, .rwc-ex-box, .rwc-rep-box, .rwc-card { break-inside:avoid; page-break-inside:avoid; }
  .rwc-rep-head { break-after:avoid; page-break-after:avoid; }
  tr, .rwc-legend { break-inside:avoid; page-break-inside:avoid; }
  thead { display:table-header-group; }
  .rwc-table-wrap { max-height:none !important; overflow:visible !important; }

  /* the Explain sheet prints A4 portrait, so it reflows narrower */
  .rwc-ex-steps { grid-template-columns:repeat(2,1fr) !important; }
  .rwc-ex-cols  { grid-template-columns:1fr !important; }
}
.rwc-report.rwc-preview { display:block; position:fixed; inset:0; z-index:200; background:#fff; color:#111; overflow:auto; padding:66px 22px 28px; }

/* #rwc-report sits outside #rwc-app, so the design tokens do not reach it — the
   sheet is a white document preview either way, so the bar is styled literally.
   (This is also why the primary button used to render with no fill at all.) */
.rwc-rep-bar {
  position:fixed; top:0; left:0; right:0; z-index:210;
  display:flex; align-items:center; gap:8px;
  padding:9px 16px;
  background:#fcfcfb; border-bottom:1px solid #d7d6d1;
  box-shadow:0 1px 8px rgba(0,0,0,.10);
}
.rwc-rep-bar-title { flex:1 1 auto; min-width:0; font-size:12.5px; font-weight:650; color:#14140f; line-height:1.25; }
.rwc-rep-bar-title small { display:block; font-weight:400; font-size:11px; color:#85847e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rwc-rep-bar .rwc-btn { color:#14140f; background:#f0efec; border-color:#d7d6d1; flex:0 0 auto; }
.rwc-rep-bar .rwc-btn:hover { background:#e6e5e1; border-color:#b9b8b2; }
.rwc-rep-bar .rwc-btn.rwc-primary { background:#2a78d6; color:#fff; border-color:transparent; }
.rwc-rep-bar .rwc-btn.rwc-primary:hover { background:#2468bb; }
.rwc-rep-sheet { max-width: 1580px; margin:0 auto; }
.rwc-rep-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:2px solid #111; padding-bottom:8px; margin-bottom:14px; }
.rwc-rep-head h1 { font-size:20px; margin:0 0 2px; letter-spacing:-.02em; }
.rwc-rep-head p { font-size:11.5px; margin:0; color:#555; }
.rwc-rep-meta { font-size:11px; color:#555; text-align:right; line-height:1.5; }
/* the rainfall provenance rides along in the sheet header, so an exported PDF
   carries its own citation. Smaller than the rest of the meta block, but it
   must stay legible in print. */
.rwc-rep-prov { font-size:9.5px; color:#6b6b6b; }
.rwc-rep-grid { display:grid; grid-template-columns: 1.35fr 1fr 1fr; gap:16px; align-items:start; }
.rwc-rep-grid img { width:100%; height:auto; border:1px solid #ccc; border-radius:4px; display:block; }
.rwc-rep-box { border:1px solid #ccc; border-radius:4px; padding:9px 11px; }
.rwc-rep-box h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:0 0 7px; color:#555; }
.rwc-rep-box svg { width:100%; height:auto; }
.rwc-rep-kv { display:grid; grid-template-columns: 1fr auto; gap:2px 10px; font-size:11px; }
.rwc-rep-kv dt { color:#555; }
.rwc-rep-kv dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.rwc-rep-table { width:100%; border-collapse:collapse; font-size:10px; font-variant-numeric:tabular-nums; }
.rwc-rep-table th, .rwc-rep-table td { padding:2px 4px; text-align:right; border-bottom:1px solid #ddd; }
.rwc-rep-table th:first-child, .rwc-rep-table td:first-child { text-align:left; }
.rwc-rep-foot { display:flex; justify-content:space-between; font-size:10.5px; color:#555; border-top:1px solid #ccc; margin-top:14px; padding-top:7px; }


/* ---------- guided tour ---------- */
/* Tour chrome lives inside #rwc-app so the design tokens resolve, and is fixed
   so #rwc-app's overflow:hidden cannot clip it. */
.rwc-tour-block { position:fixed; inset:0; z-index:300; }
.rwc-tour-ring {
  position:fixed; z-index:301; pointer-events:none; border-radius:10px;
  /* the giant spread shadow IS the dimmed backdrop, leaving the target as a hole */
  box-shadow: 0 0 0 2.5px var(--accent), 0 0 0 9999px rgba(8,10,12,.58);
  transition: top .3s cubic-bezier(.4,0,.2,1), left .3s cubic-bezier(.4,0,.2,1),
              width .3s cubic-bezier(.4,0,.2,1), height .3s cubic-bezier(.4,0,.2,1);
}
.rwc-tour-ring.rwc-nohole { box-shadow: 0 0 0 9999px rgba(8,10,12,.62); }

.rwc-tour-card {
  position:fixed; z-index:302;
  width: min(370px, calc(100vw - 28px));
  padding: 13px 16px 14px;
  background: var(--surface-1); color: var(--ink);
  border:1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: 0 18px 50px rgba(0,0,0,.32), 0 3px 10px rgba(0,0,0,.14);
  transition: top .3s cubic-bezier(.4,0,.2,1), left .3s cubic-bezier(.4,0,.2,1);
}
.rwc-tour-caret {
  position:absolute; width:12px; height:12px; background: var(--surface-1);
  border-left:1px solid var(--line-strong); border-top:1px solid var(--line-strong);
}
.rwc-tour-top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.rwc-tour-dots { display:flex; gap:4px; flex:1 1 auto; }
.rwc-tour-dots i {
  width:5px; height:5px; border-radius:3px; background: var(--line-strong);
  transition: width .2s, background .2s;
}
.rwc-tour-dots i.rwc-on { width:16px; background: var(--accent); }
.rwc-tour-skip {
  border:0; background:transparent; padding:2px 4px; cursor:pointer;
  font: inherit; font-size:11.5px; color: var(--ink-3); flex:0 0 auto;
}
.rwc-tour-skip:hover { color: var(--ink); text-decoration: underline; }
.rwc-tour-card h2 { font-size:15px; font-weight:650; letter-spacing:-.01em; margin:0 0 5px; }
.rwc-tour-card p  { font-size:12.5px; line-height:1.5; color: var(--ink-2); margin:0; }
.rwc-tour-card p b { color: var(--ink); font-weight:600; }
.rwc-tour-foot {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:12px; padding-top:11px; border-top:1px solid var(--line);
}
.rwc-tour-foot .rwc-check { flex:1 1 auto; font-size:11.5px; padding:0; }
.rwc-tour-nav { display:flex; gap:6px; flex:0 0 auto; }
.rwc-tour-nav .rwc-btn { border-color: var(--line); background: var(--surface-2); font-size:12.5px; }
.rwc-tour-nav .rwc-btn:hover { background: var(--surface-3); }
.rwc-tour-nav .rwc-btn.rwc-primary { background: var(--accent); color: var(--accent-ink); border-color:transparent; }
.rwc-tour-nav .rwc-btn.rwc-primary:hover { filter: brightness(1.08); }
@media (max-width: 560px) {
  .rwc-tour-foot .rwc-check { flex:1 0 100%; order:1; }
  .rwc-tour-nav { flex:1 0 100%; order:2; justify-content:flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .rwc-tour-ring, .rwc-tour-card { transition: none !important; }
}
@media print { .rwc-tour-block, .rwc-tour-ring, .rwc-tour-card { display:none !important; } }

/* ---------- mobile drawer + responsive ---------- */
.rwc-mob-tabs { display:none; }

@media (max-width: 1180px) {
  #rwc-app { grid-template-columns: 56px minmax(0, 1fr) 300px; }
  #rwc-app[data-mode="analysis"] { grid-template-columns: 0 minmax(0, 1fr) 300px; }
  .rwc-tree .rwc-panel-head span, .rwc-tree-item .rwc-ti-name, .rwc-tree-item .rwc-ti-meta, .rwc-tree-del { display:none; }
  .rwc-tree-item { justify-content:center; padding:9px 4px; }
  .rwc-tree-list { padding:6px 4px; }
  .rwc-brand-txt { display:none; }
}

@media (max-width: 860px) {
  #rwc-app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(200px, 1fr) auto auto auto;
    grid-template-areas: "bar" "view" "kpi" "props" "foot";
    height: 100dvh;
  }
  #rwc-app[data-mode="analysis"] { grid-template-columns:minmax(0,1fr); grid-template-rows: auto minmax(180px,.8fr) minmax(240px,1.2fr) auto auto; grid-template-areas:"bar" "view" "kpi" "props" "foot"; }
  .rwc-tree { display:none !important; }
  .rwc-props { border-left:0; border-top:1px solid var(--line); max-height: 42dvh; }
  .rwc-props .rwc-panel-head { display:none; }
  .rwc-kpi { max-height: none; }
  .rwc-kpi-tiles { border-top:0; }
  .rwc-tile { min-width: 116px; padding:8px 12px; }
  .rwc-tile-v { font-size:16px; }
  .rwc-mob-tabs { display:flex; }
  .rwc-readout { display:none; }
  .rwc-chart-grid { grid-template-columns: 1fr; }
  #rwc-app[data-mode="present"] { grid-template-rows: 1fr auto auto; grid-template-areas:"view" "kpi" "foot"; }
  #rwc-app[data-mode="present"] .rwc-props { display:none; }
}

@media (max-width: 560px) {
  #rwc-app { font-size: 13px; }
  .rwc-bar { padding: 6px; gap:2px; }
  .rwc-btn span.rwc-btn-label { display:none; }
  .rwc-btn.rwc-keep-label span.rwc-btn-label { display:inline; }
  .rwc-brand { padding-right:8px; margin-right:2px; }
  .rwc-foot-r { display:none; }
  .rwc-roofgrid { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  #rwc-app *, #rwc-app *::before, #rwc-app *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
}
#rwc-app .rwc-sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
</style>
</head>
<body class="rwc-standalone">

<div id="rwc-app" data-mode="design">

  <!-- ══════════════════════════ TOOLBAR ══════════════════════════ -->
  <header class="rwc-bar" role="toolbar" aria-label="Main toolbar">
    <div class="rwc-brand">
      <div class="rwc-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5 5.5 12.2a7.6 7.6 0 1 0 13 0Z"/></svg>
      </div>
      <div class="rwc-brand-txt">
        <b>Rainwater Harvesting Studio</b>
        <span>Parametric design tool</span>
      </div>
    </div>

    <button class="rwc-btn" id="rwc-new" title="New model (Ctrl+N)">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>
      <span class="rwc-btn-label">New</span>
    </button>
    <button class="rwc-btn" id="rwc-open" title="Open model .json (Ctrl+O)">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      <span class="rwc-btn-label">Open</span>
    </button>
    <button class="rwc-btn" id="rwc-save" title="Save model .json (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      <span class="rwc-btn-label">Save</span>
    </button>
    <input type="file" id="rwc-file" accept=".json,application/json" class="rwc-sr" tabindex="-1">

    <span class="rwc-sep"></span>

    <button class="rwc-btn" id="rwc-models-btn" aria-haspopup="menu" aria-expanded="false" title="Demo model library">
      <svg viewBox="0 0 24 24"><path d="M12 2.8 21 7.4 12 12 3 7.4Z"/><path d="M3 12.2 12 16.8l9-4.6M3 16.8 12 21.4l9-4.6"/></svg>
      <span class="rwc-btn-label">Models</span><svg class="rwc-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <button class="rwc-btn" id="rwc-add-btn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="rwc-btn-label">Add block</span>
    </button>

    <span class="rwc-sep"></span>

    <button class="rwc-btn rwc-icon-btn" id="rwc-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M3 8h11a6 6 0 0 1 0 12H8"/><path d="m7 4-4 4 4 4"/></svg>
    </button>
    <button class="rwc-btn rwc-icon-btn" id="rwc-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg viewBox="0 0 24 24"><path d="M21 8H10a6 6 0 0 0 0 12h6"/><path d="m17 4 4 4-4 4"/></svg>
    </button>

    <span class="rwc-spacer"></span>

    <button class="rwc-btn rwc-keep-label" id="rwc-explain-btn" title="Explain the result — what each number means and which one is the answer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M12 16.5v-5M12 8h.01"/></svg>
      <span class="rwc-btn-label">Explain</span>
    </button>

    <button class="rwc-btn" id="rwc-export-btn" aria-haspopup="menu" aria-expanded="false" title="Export">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      <span class="rwc-btn-label">Export</span><svg class="rwc-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <button class="rwc-btn" id="rwc-mode-btn" aria-haspopup="menu" aria-expanded="false" title="Workspace mode">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="rwc-btn-label" id="rwc-mode-label">Design</span><svg class="rwc-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>

  tile:"rough", metal:"smooth", felt:"flatNoGravel",
  concrete:"sealed", green:"greenExt", gravel:"flatGravel"

/* ── Climate library ─────────────────────────────────────────────────────────

   geocodes each city and reduces a daily precipitation series from the source
   named in CLIMATE_SOURCE below. Do not hand-edit them: run the generator, so
   that what the app shows and what `docs/climate-source.json` records stay the

   The library is now sourced, and not uniformly: 22 cities carry WMO Climate
   Normals 1991-2020 and 6 carry WWIS records over their own periods, because
   their countries contribute no station to the Normals composite. Every city
   records which source, station and distance it came from.

   TEACHING FIGURES with no dataset behind them — good enough to compare one
   roof against another, not citable as climate data. The app says so wherever
   it prints a location. */

/* The window both the preset library and the in-app fetch are built on. 1991-2020
   is the WMO standard normal period, so a fetched site and a preset are the same
   kind of figure over the same years and can be compared. It is a baseline, not
   current conditions — see the National Annex NA.4 note in the method notes. */
const CLIMATE_WINDOW = { from:"1991-01-01", to:"2020-12-31", label:"1991–2020" };

   nowhere to generate this from, and a date written out four times goes stale

  url:    "https://karam.me.uk/applications/rainwater-harvesting-studio/"

const CLIMATE_SOURCE = {
  sourced:  true,
  name:     "WMO Climate Normals 1991-2020 (NOAA NCEI) where available; WMO World Weather Information Service (WWIS) otherwise",
  endpoint: "https://worldweather.wmo.int/en/json/{cityId}_en.json",
  window:   "1991-2020 for 22 cities; 6 from WWIS over other periods — see docs/climate-source.json",
  accessed: "2026-09-16",

};

/* One-line provenance for the preset library. */
function climateProvenance() {
  const C = CLIMATE_SOURCE;
  return C.sourced
    ? `${C.name} · ${C.window} · retrieved ${C.accessed}`
    : C.note;
}

/* Reduce a daily precipitation series to the twelve monthly means and the depth
   per wet day that this app works in. The preset library and a student's own
   Open-Meteo fetch both go through here, so the two can never diverge in method.

     monthly[m] = total of month m over the series / number of distinct years
     wet day    = a day of 1 mm or more
     dpd        = annual rain / annual wet days, rounded, clamped to 2..30

   `time` is an array of "YYYY-MM-DD"; `precip` the matching daily totals in mm,
   nulls allowed for gaps. Pure: same input, same output, no clock, no network. */
const CLIMATE = {
  reduce(time, precip) {
    if (!Array.isArray(time) || !Array.isArray(precip) || !time.length)
      throw new Error("CLIMATE.reduce: empty series");
    const tot = new Array(12).fill(0), wet = new Array(12).fill(0), yrs = new Set();
    let used = 0;
    for (let i = 0; i < time.length; i++) {
      const v = precip[i];
      if (v == null || !isFinite(v)) continue;
      const mo = +time[i].slice(5, 7) - 1;
      if (!(mo >= 0 && mo < 12)) continue;
      tot[mo] += v; yrs.add(time[i].slice(0, 4));
      if (v >= 1) wet[mo]++;
      used++;
    }
    if (!used) throw new Error("CLIMATE.reduce: no usable values");
    const n = Math.max(1, yrs.size);
    const monthly = tot.map(v => Math.round((v / n) * 10) / 10);
    const wetTotal = sum(wet) / n, rainTotal = sum(tot) / n;
    const dpd = clamp(Math.round(wetTotal > 0 ? rainTotal / wetTotal : 8), 2, 30);
    return { monthly, dpd, annual: sum(monthly), years: n, days: used };
  }
};

/* Where THIS model's rainfall came from. The preset library, a scaled preset, a
   hand-typed profile and a fetched series are four different provenances, and a
   sheet that prints a location without saying which is inviting a miscitation. */
function rainfallProvenanceFor(climate) {
  switch (climate && climate.source) {
    case "open-meteo":
      return `Open-Meteo reanalysis, ${CLIMATE_WINDOW.label}, retrieved by the user`;
    case "manual":
      return "Entered by hand — source is the author's to state";
    case "preset-scaled":
      return `Preset monthly shape scaled to a chosen annual total · ${climateProvenance()}`;
    default:
      return climateProvenance();
  }
}
