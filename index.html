function climateFor(id) {
  const c = CITY_BY_ID[id];
  /* lat/lon come from the city record once the library has been regenerated by
     tools/build-climate.mjs; before that they are absent and the fetch fields
     simply start empty. */
  return { mode:"preset", cityId:id, monthly:c.r.slice(), dpd:c.dpd,
           annual:annualOf(c.r), label:c.name, source:"preset",
           lat: c.lat == null ? 0 : c.lat, lon: c.lon == null ? 0 : c.lon };
}
function climateStudy(cityId, name) {
  const m = newModel({ name });
  m.blocks=[newBlock({name:"Study block", w:16, d:10, wallH:6.5, material:"rough",
    roof:{type:"gable",pitch:30,overhang:0.5,parapet:0.6,bays:4,rise:3,ridgeRatio:1}, downpipes:2})];
  m.climate = climateFor(cityId);
  m.demand.occupants = 8; m.demand.irrigArea = 80;
  return m;
}
const DEMO_BY_ID = Object.fromEntries(DEMOS.map(d => [d.id, d]));

/* ═══════════════════════════ APP ═══════════════════════════ */

const APP = (() => {

  const $  = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const root   = $("#rwc-app");
  const canvas = $("#rwc-canvas");
  const ctx    = canvas.getContext("2d");

  let model = newModel();
  let geom, res;
  let selectedId = model.blocks[0].id;
  let tab = "geom";
  let mode = "design";
  let present = { index: -1, saved: null };
  let history = [], hIndex = -1;
  let raf = 0, needsPanels = true;

  const LS_KEY = "rwc3d.autosave.v2";

  /* --- model access ----------------------------------------------------- */

  const block = () => model.blocks.find(b => b.id === selectedId) || model.blocks[0];

  function resolve(path) {
    const parts = path.split(".");
    let obj = parts[0] === "b" ? block() : model;
    if (parts[0] === "b") parts.shift();
    for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    return { obj, key: parts[parts.length - 1] };
  }
  const getPath = p => { const r = resolve(p); return r.obj ? r.obj[r.key] : undefined; };
  const setPath = (p, v) => { const r = resolve(p); if (r.obj) r.obj[r.key] = v; };

  /* --- history ---------------------------------------------------------- */

  function snapshot() {
    const s = JSON.stringify({ model, selectedId });
    if (history[hIndex] === s) return;
    history = history.slice(0, hIndex + 1);
    history.push(s);
    if (history.length > 60) history.shift();
    hIndex = history.length - 1;
    updateUndo();
  }
  function restore(i) {
    if (i < 0 || i >= history.length) return;
    const s = JSON.parse(history[i]);
    const keep = selectedId;
    model = s.model; hIndex = i;
    /* Undo is about the model, not the selection. Keep whatever is selected if
       that block still exists — having undo jump the panel to a different block
       is disorienting, especially right after moving one. */
    selectedId = model.blocks.some(b => b.id === keep) ? keep : s.selectedId;
    updateUndo(); refresh(true);
  }
  const undo = () => restore(hIndex - 1);
  const redo = () => restore(hIndex + 1);
  function updateUndo() {
    $("#rwc-undo").disabled = hIndex <= 0;
    $("#rwc-redo").disabled = hIndex >= history.length - 1;
    $("#rwc-undo").style.opacity = hIndex <= 0 ? .35 : 1;
    $("#rwc-redo").style.opacity = hIndex >= history.length - 1 ? .35 : 1;
  }

  /* --- refresh cycle ---------------------------------------------------- */

  function refresh(structural) {
    if (structural) needsPanels = true;
    geom = GEO.build(model);
    res  = HYD.compute(model, geom);
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      draw();
      tiles();
      if (needsPanels) { panels(); tree(); needsPanels = false; }
      if (mode === "analysis") charts();
      readout();
      autosave();
    });
  }

  /* Moving a block changes geometry but no hydrology — catchment, rainfall and
     demand are all unaffected by position. Skip HYD.compute (its 37-point
     capacity sweep is the expensive part) while dragging. */
  function refreshGeom() {
    geom = GEO.build(model);
    draw(); readout(); tree();
  }

  let saveTimer = 0;
  function autosave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(model)); }
      catch (e) { /* private mode or quota — the app works without it */ }
    }, 700);
  }

  /* --- canvas ----------------------------------------------------------- */

  let cw = 800, ch = 500;
  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cw = Math.max(80, r.width); ch = Math.max(80, r.height);
    canvas.width  = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw() {
    if (!geom) return;
    sizeCanvas();
    R3D.render(ctx, cw, ch, model, geom, res, { selected: selectedId, scale: 1 });
  }

  function readout() {
    const b = block();
    const p = geom.per.find(x => x.id === (b && b.id)) || { proj: 0, surf: 0 };
    const ratio = p.proj > 0 ? p.surf / p.proj : 1;
    $("#rwc-readout").innerHTML =
      `<b>${esc(b ? b.name : "—")}</b> · ${ROOFS[b.roof.type].label}<br>` +
      `catchment <b>${nf(p.proj, 1)} m²</b> · surface ${nf(p.surf, 1)} m² (×${nf(ratio, 2)})<br>` +
      `model total <b>${nf(geom.catchment, 1)} m²</b> · e ${nf(geom.ycMean, 2)}`;
    $("#rwc-foot-status").textContent =
      `${model.blocks.length} block${model.blocks.length === 1 ? "" : "s"} · ${esc(model.climate.label)} · ${nf(res.annualRain, 0)} mm/yr`
      + (geom.overlaps.length ? ` · ⚠ ${geom.overlaps.length} plan overlap${geom.overlaps.length === 1 ? "" : "s"}` : "");
  }

  /* --- KPI tiles -------------------------------------------------------- */

  function tile(o) {
    return `<button class="rwc-tile${o.key ? " rwc-key" : ""}" data-explain="${o.step}"
        title="Explain this number">
      <span class="rwc-tile-tag">${esc(o.tag)}</span>
      <span class="rwc-tile-k">${esc(o.k)}</span>
      <span class="rwc-tile-v">${o.v}${o.u ? `<small>${esc(o.u)}</small>` : ""}</span>
      <span class="rwc-tile-s">${esc(o.s)}</span></button>`;
  }
  function tiles() {
    /* Annual yield is the HARVEST, A.R.Yc.Fc — not res.bal.totalSupplied, which
       is what the tank managed to deliver. Printing the latter under the former's
       formula made overflow exceed yield, which is impossible. */
    const y = fmtVol(res.annualInflow), d = fmtVol(res.annualDemand);
    const c = fmtVol(res.capacity), o = fmtVol(res.bal.totalOverflow);
    const spill = res.annualInflow > 0 ? res.bal.totalOverflow / res.annualInflow : 0;
    $("#rwc-tiles").innerHTML =
      tile({ tag:"Input", k:"Catchment", v:nf(geom.catchment, 1), u:"m²", step:"catchment",
             s:`roof surface ${nf(geom.surface, 0)} m²` }) +
      tile({ tag:"Harvest", k:"Annual yield", v:y.v, u:y.u, step:"yield",
             s:`${nf(res.annualRain, 0)} mm · e ${nf(geom.ycMean, 2)} · η ${nf(model.system.filterCoef, 2)}` }) +
      tile({ tag:"Need", k:"Non-potable demand", v:d.v, u:d.u, step:"demand",
             s:`${model.demand.occupants} people${model.demand.irrigArea > 0 ? " + irrigation" : ""}` }) +
      tile({ tag:"Deliverable", k:"Storage capacity", v:c.v, u:c.u, step:"store", key:true,
             s:`${nf(res.daysStorage, 0)} days · ${model.system.tankMode === "auto" ? "BS A.2.1" : "set manually"}` }) +
      tile({ tag:"Justification", k:"Demand met", v:fmtPct(res.bal.saving), u:"", step:"met",
             s:`${fmtPct(res.bal.saving)} coverage · ${fmtPct(res.bal.reliability)} of ${model.system.daily ? "days" : "months"} full` }) +
      tile({ tag:"Benefit", k:"Mains displaced", v:nf(res.mainsSaved, 1), u:"m³/yr", step:"mains",
             s:`≈ ${nf(res.costSaved, 0)} per year at ${nf(model.system.tariff, 2)}/m³` }) +
      tile({ tag:"Diagnostic", k:"Overflow", v:o.v, u:o.u, step:"overflow",
             s:`${fmtPct(spill)} of the harvest spilled` });
  }

  /* --- model tree ------------------------------------------------------- */

  function tree() {
    const list = $("#rwc-tree-list");
    list.innerHTML = model.blocks.map(b => {
      const p = geom.per.find(x => x.id === b.id) || { proj: 0 };
      const clash = geom.overlaps.some(o => o.a === b.id || o.b === b.id);
      return `<button class="rwc-tree-item" role="option" data-block="${b.id}" aria-current="${b.id === selectedId}"${
        clash ? ' title="Overlaps another block in plan" style="color:var(--warn)"' : ""}>
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>
        <span class="rwc-ti-name" title="${esc(b.name)}">${esc(b.name)}</span>
        <span class="rwc-ti-meta">${nf(p.proj, 0)} m²</span>
        ${model.blocks.length > 1 ? `<span class="rwc-tree-del" role="button" tabindex="0" data-del="${b.id}" title="Delete block" aria-label="Delete ${esc(b.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></span>` : ""}
      </button>`;
    }).join("") +
    `<button class="rwc-tree-item" id="rwc-tree-add" style="color:var(--accent)">
       <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="rwc-ti-name">Add block</span></button>`;
  }

  /* --- toast ------------------------------------------------------------ */

  let toastT = 0;
  function toast(msg) {
    const t = $("#rwc-toast");
    t.textContent = msg; t.classList.add("rwc-on");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("rwc-on"), 2600);
  }

  /* ═══════════════ parameter panels ═══════════════ */

  function fRange(label, path, min, max, step, unit, dp) {
    const v = getPath(path);
    return `<div class="rwc-field">
      <div class="rwc-field-row"><span class="rwc-label">${esc(label)}</span>
        <span class="rwc-unit" data-out="${path}">${nf(v, dp)}${unit ? " " + unit : ""}</span></div>
      <div class="rwc-slider-row">
        <input type="range" data-path="${path}" data-dp="${dp}" data-unit="${esc(unit || "")}"
               min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${esc(label)}">
        <input type="number" data-path="${path}" data-dp="${dp}" data-unit="${esc(unit || "")}"
               min="${min}" max="${max}" step="${step}" value="${nf(v, dp).replace(/,/g, "")}" aria-label="${esc(label)} value">
      </div></div>`;
  }
  function fSelect(label, path, opts) {
    const v = getPath(path);
    return `<div class="rwc-field">
      <div class="rwc-field-row"><span class="rwc-label">${esc(label)}</span></div>
      <select data-path="${path}" data-struct="1" aria-label="${esc(label)}">
        ${opts.map(o => `<option value="${esc(o.v)}"${o.v === v ? " selected" : ""}>${esc(o.l)}</option>`).join("")}
      </select></div>`;
  }
  function fCheck(label, path) {
    return `<label class="rwc-check"><input type="checkbox" data-path="${path}" data-struct="1"${getPath(path) ? " checked" : ""}> ${esc(label)}</label>`;
  }
  function fSeg(label, path, opts) {
    const v = getPath(path);
    return `<div class="rwc-field">
      <div class="rwc-field-row"><span class="rwc-label">${esc(label)}</span></div>
      <div class="rwc-seg" role="group" aria-label="${esc(label)}">
        ${opts.map(o => `<button type="button" data-path="${path}" data-val="${esc(o.v)}" data-struct="1" aria-pressed="${o.v === v}">${esc(o.l)}</button>`).join("")}
      </div></div>`;
  }
  const grp = (title, body) => `<div class="rwc-group"><h3 class="rwc-group-title">${esc(title)}</h3>${body}</div>`;

  function panels() {
    const b = block();
    if (!b) return;
    panelGeom(b); panelRoof(b); panelClimate(); panelDemand(); panelResults();
    $$(".rwc-tab").forEach(t => {
      const on = t.dataset.tab === tab;
      t.setAttribute("aria-selected", on);
      $("#panel-" + t.dataset.tab).hidden = !on;
    });
  }

  function panelGeom(b) {
    $("#panel-geom").innerHTML =
      grp("Block", `
        <div class="rwc-field">
          <div class="rwc-field-row"><span class="rwc-label">Name</span></div>
          <input type="text" data-path="b.name" data-struct="1" value="${esc(b.name)}" aria-label="Block name">
        </div>` +
        fRange("Width (X)", "b.w", 2, 120, 0.5, "m", 1) +
        fRange("Depth (Z)", "b.d", 2, 120, 0.5, "m", 1) +
        fRange("Wall / eaves height", "b.wallH", 2, 40, 0.25, "m", 2)) +
      grp("Position in plan",
        fRange("Offset X", "b.x", -120, 120, 0.5, "m", 1) +
        fRange("Offset Z", "b.z", -120, 120, 0.5, "m", 1) +
        overlapNote()) +
      grp("Rainwater outlets",
        fRange("Downpipes on this block", "b.downpipes", 1, 24, 1, "", 0)) +
      grp("Block actions",
        `<div style="display:flex;gap:6px">
          <button class="rwc-btn" id="rwc-dup" style="flex:1;justify-content:center;border-color:var(--line);background:var(--surface-2)">Duplicate</button>
          <button class="rwc-btn" id="rwc-del" style="flex:1;justify-content:center;border-color:var(--line);background:var(--surface-2)"${model.blocks.length < 2 ? " disabled" : ""}>Delete</button>
        </div>`);
  }

  /* Overlapping footprints double-count catchment and put two surfaces in the
     same place, which no painter's ordering can resolve. Nothing enforced the
     old advisory note, so say it only when it is actually true — and name the
     blocks involved. */
  function overlapNote() {
    const bad = geom.overlaps.filter(o => o.a === selectedId || o.b === selectedId);
    if (!bad.length)
      return `<p class="rwc-note"><b>Drag the selected block</b> in the model space to move it, or use the offsets above. Blocks must not overlap in plan, roof overhangs included — overlapping footprints double-count catchment and cannot be depth-sorted correctly.</p>`;
    return `<p class="rwc-note rwc-warn"><b>Overlaps in plan.</b> This block overlaps
      ${bad.map(o => esc(o.names[o.a === selectedId ? 1 : 0])).join(" and ")}
      by ${nf(sum(bad.map(o => o.area)), 1)} m², roof overhangs included.
      That area is counted twice in the catchment and the two roofs render through
      each other. Move the blocks apart, or reduce the overhang.</p>`;
  }

  function panelRoof(b) {
    const R = b.roof, mat = MATERIALS[b.material];
    const per = geom.per.find(x => x.id === b.id) || { proj: 0, surf: 0 };
    const ratio = per.proj > 0 ? per.surf / per.proj : 1;

    let params = fRange("Pitch", "b.roof.pitch", 1, 60, 0.5, "°", 1);
    if (R.type === "flat")      params = fRange("Fall", "b.roof.pitch", 1, 10, 0.5, "°", 1) + fRange("Parapet height", "b.roof.parapet", 0, 2, 0.05, "m", 2);
    if (R.type === "vault")     params = fRange("Rise at crown", "b.roof.rise", 0.5, 20, 0.25, "m", 2);
    if (R.type === "sawtooth")  params = fRange("Pitch", "b.roof.pitch", 5, 60, 0.5, "°", 1) + fRange("Number of bays", "b.roof.bays", 1, 12, 1, "", 0);
    if (R.type === "hip")       params = fRange("Pitch", "b.roof.pitch", 5, 60, 0.5, "°", 1) + fRange("Ridge length", "b.roof.ridgeRatio", 0, 1, 0.05, "× max", 2);
    params += fRange("Eaves overhang", "b.roof.overhang", 0, 3, 0.05, "m", 2);

    $("#panel-roof").innerHTML =
      grp("Roof form",
        `<div class="rwc-roofgrid" role="group" aria-label="Roof type">
          ${ROOF_ORDER.map(t => `<button type="button" data-roof="${t}" aria-pressed="${t === R.type}" title="${esc(ROOFS[t].tip)}">
            <svg viewBox="0 0 40 26">${`<path d="${ROOFS[t].icon}"/>`}</svg>${esc(ROOFS[t].label)}</button>`).join("")}
        </div>
        <p class="rwc-note" style="margin-top:8px"><b>${esc(ROOFS[R.type].label)}.</b> ${esc(ROOFS[R.type].tip)}</p>`) +
      grp("Roof parameters", params) +
      grp("Surface", fSelect("Roof material", "b.material", MATERIAL_ORDER.map(k => ({ v: k, l: `${MATERIALS[k].label} — e ${MATERIALS[k].yc.toFixed(2)}` }))) +
        `<p class="rwc-note">Surface yield coefficient <b>e = ${mat.yc.toFixed(2)}</b>, BS EN 16941-1:2024 Table 2. It scales the harvest, not the catchment area.</p>`) +
      grp("Catchment vs surface", `
        <dl class="rwc-rep-kv" style="font-size:12px">
          <dt>Projected catchment</dt><dd>${nf(per.proj, 1)} m²</dd>
          <dt>True roof surface</dt><dd>${nf(per.surf, 1)} m²</dd>
          <dt>Surface / catchment</dt><dd>× ${nf(ratio, 3)}</dd>
        </dl>
        <p class="rwc-note">${ratio > 1.01
          ? `This roof has <b>${nf((ratio - 1) * 100, 0)}% more surface</b> than catchment. Rain falls vertically, so only the plan-projected area collects — the extra surface adds material cost and nothing else to the harvest.`
          : `Catchment equals surface: this roof is horizontal in projection.`}</p>`);
  }

  function panelClimate() {
    const C = model.climate;
    const zones = {};
    for (const c of CITIES) (zones[c.zone] = zones[c.zone] || []).push(c);
    let body = fSeg("Rainfall input", "climate.mode", [
      { v: "preset", l: "Preset" }, { v: "manual", l: "Monthly" }, { v: "annual", l: "Annual" }]);

    if (C.mode === "preset") {
      body += `<div class="rwc-field">
        <div class="rwc-field-row"><span class="rwc-label">Location</span></div>
        <select id="rwc-city" aria-label="Location">
          ${Object.keys(zones).sort().map(z => `<optgroup label="${esc(z)}">${zones[z].map(c =>
            `<option value="${c.id}"${c.id === C.cityId ? " selected" : ""}>${esc(c.name)} — ${nf(annualOf(c.r), 0)} mm</option>`).join("")}</optgroup>`).join("")}
        </select></div>
        <p class="rwc-note${CLIMATE_SOURCE.sourced ? "" : " rwc-warn"}">${esc(climateProvenance())}${
          CLIMATE_SOURCE.sourced ? "" : " Fetch or type real rainfall before quoting a number."}</p>`;
    } else if (C.mode === "annual") {
      body += fRange("Annual rainfall", "climate.annual", 0, 5000, 10, "mm", 0) +
        `<p class="rwc-note">Distributed using the monthly <em>shape</em> of ${esc(C.label)}, scaled to this total. Same annual depth, different distribution, gives a very different tank size — that is the point of the climate comparison models.</p>`;
    } else {
      body += `<div class="rwc-field"><div class="rwc-field-row"><span class="rwc-label">Monthly rainfall</span><span class="rwc-unit">${nf(sum(C.monthly), 0)} mm/yr</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">
          ${MONTHS.map((mn, i) => `<label style="font-size:10.5px;color:var(--ink-3)">${mn}
            <input type="number" data-month="${i}" min="0" max="2000" step="1" value="${nf(C.monthly[i], 0)}" style="width:100%;text-align:right" aria-label="${mn} rainfall in mm"></label>`).join("")}
        </div></div>`;
    }

    body += `<div class="rwc-card" style="padding:8px 6px 2px;margin-top:6px">${CHART.wrap(CHART.rainfall(C.monthly))}</div>`;
    body += fRange("Typical depth per wet day", "climate.dpd", 2, 30, 1, "mm", 0);
    body += `<p class="rwc-note">Sets how many rain days each month has. It drives first-flush losses and the daily balance option; it does not change the annual yield.</p>`;

    $("#panel-climate").innerHTML =
      grp("Rainfall", body) +
      grp("Fetch from Open-Meteo", `
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <input type="number" id="rwc-lat" step="0.01" min="-90" max="90" value="${C.lat}" placeholder="lat" aria-label="Latitude" style="flex:1;width:auto;text-align:right">
          <input type="number" id="rwc-lon" step="0.01" min="-180" max="180" value="${C.lon}" placeholder="lon" aria-label="Longitude" style="flex:1;width:auto;text-align:right">
        </div>
        <button class="rwc-btn" id="rwc-fetch" style="width:100%;justify-content:center;border-color:var(--line);background:var(--surface-2)">Fetch ${CLIMATE_WINDOW.label} monthly means</button>
        <p class="rwc-note" id="rwc-fetch-note">Reduced the same way as the presets, over the same ${CLIMATE_WINDOW.label} window, so the two are comparable. Optional and needs internet: classroom networks, offline use and a strict WordPress content policy will all block it — the presets and the monthly table always work. Fetched values land in the editable table so you can correct them.</p>
        <p class="rwc-note">Open-Meteo serves a <b>reanalysis</b> \u2014 a model estimate on a grid \u2014 not a rain gauge. Expect it to differ from a nearby station, most of all in convective and mountainous climates. The archive draws on more than one reanalysis dataset and picks by location; <b>tools/build-climate.mjs</b> records which one answered, and that is the one to cite.</p>`);
  }

  function panelDemand() {
    const D = model.demand, S = model.system;
    const perPerson = sum(D.uses.filter(u => u.on).map(u => u.lpd));
    $("#panel-demand").innerHTML =
      grp("Occupancy & end uses",
        fRange("Occupants", "demand.occupants", 0, 2000, 1, "people", 0) +
        D.uses.map((u, i) => {
          const meta = ENDUSES.find(e => e.id === u.id) || { label: u.id };
          return `<div class="rwc-field" style="margin-bottom:6px"><div class="rwc-slider-row">
            <input type="checkbox" data-use="${i}" data-field="on" data-struct="1"${u.on ? " checked" : ""} aria-label="Use ${esc(meta.label)}">
            <span class="rwc-label" style="flex:1">${esc(meta.label)}</span>
            <input type="number" data-use="${i}" data-field="lpd" min="0" max="300" step="1" value="${u.lpd}" aria-label="${esc(meta.label)} litres per person per day">
            <span class="rwc-unit">l/p/d</span></div></div>`;
        }).join("") +
        `<p class="rwc-note">Non-potable demand = <b>${nf(perPerson, 0)} l/person/day × ${D.occupants} = ${nf(perPerson * D.occupants, 0)} litres/day</b>.</p>`) +
      grp("Irrigation",
        fRange("Irrigated area", "demand.irrigArea", 0, 5000, 10, "m²", 0) +
        (D.irrigArea > 0 ? fRange("Application rate", "demand.irrigMM", 0, 60, 1, "mm/week", 0) +
          fSelect("Season starts", "demand.irrigFrom", MONTHS.map((m, i) => ({ v: i, l: m }))) +
          fSelect("Season ends", "demand.irrigTo", MONTHS.map((m, i) => ({ v: i, l: m }))) : "")) +
      grp("System",
        fRange("Treatment coefficient η", "system.filterCoef", 0.5, 1, 0.01, "", 2) +
        `<p class="rwc-note">η is the hydraulic treatment efficiency coefficient in BS EN 16941-1. Where the manufacturer does not state a figure, the standard says <b>0.9</b> can be used for a system with no additional treatment — a default, not a requirement. Use the manufacturer's value when you have one.</p>` +
        fRange("First flush diverted", "system.firstFlush", 0, 3, 0.1, "mm/event", 1) +
        `<p class="rwc-note">First-flush diversion is this tool's own addition. It is not part of the standard's yield formula, which has no first-flush term. Leave it at 0 to calculate strictly to BS EN 16941-1.</p>` +
        fSeg("Storage capacity", "system.tankMode", [{ v: "auto", l: "BS basic approach" }, { v: "manual", l: "Set manually" }]) +
        (S.tankMode === "manual" ? fRange("Tank capacity", "system.tank", 0, 200000, 100, "L", 0)
          : fRange("Design dry period", "system.dryDays", 1, 60, 1, "days", 0) +
            `<p class="rwc-note">Basic approach, A.2.1: the lesser of annual yield and annual demand × dry period ÷ 365. The standard's examples are <b>15</b> days (Netherlands), <b>18</b> (Ireland, UK), <b>21</b> (Germany) — choose for your location, and consider how climate change shifts it.${res.naHalved ? ` Yield ÷ demand is <b>${nf(res.ydRatio,2)}</b>, outside 0.5–2.0, so the UK National Annex NA.3 halving is applied: <b>${nf(res.dryDays,1)}</b> days used.` : ""}<br>Sized at <b>${fmtVol(res.simple).v} ${fmtVol(res.simple).u}</b>.</p>`) +
        fCheck("Daily balance (spread rain over wet days)", "system.daily") +
        `<p class="rwc-note">The balance can be stepped monthly or daily, and the choice matters more than it looks. On a <b>monthly</b> step the whole month's demand is drawn in one go against whatever the store held at the end of the previous month, so the store can never deliver more than <b>one tank-full per month</b> however often it would really refill. On a <b>daily</b> step the month's depth is spread over its wet days and the store refills between draws. Neither is the standard's detailed approach, which needs measured daily rainfall.</p>` +
        (!S.daily && res.capacity > 0 && res.capacity < res.maxMonthDemand
          ? `<p class="rwc-note rwc-warn">This store holds ${fmtVol(res.capacity).v} ${fmtVol(res.capacity).u} and the busiest month demands ${fmtVol(res.maxMonthDemand).v} ${fmtVol(res.maxMonthDemand).u}. On a monthly step that caps the supply at one tank-full a month, so the coverage shown here is far below what this tank would really achieve. Switch on the daily balance.</p>`
          : "") +
        fRange("Mains water tariff", "system.tariff", 0, 20, 0.05, "/m³", 2));
  }

  let variants = [];

  function panelResults() {
    const b = res.bal;
    const y = fmtVol(res.annualInflow);
    const eq = `${nf(geom.catchment, 1)} m² × ${nf(res.annualRain, 0)} mm × ${nf(geom.ycMean, 2)} × ${nf(model.system.filterCoef, 2)}`;

    $("#panel-results").innerHTML =
      grp("Method — BS EN 16941-1", `
        <p class="rwc-note" style="font-size:11.5px;line-height:1.5">
          <b>Y = A · e · h · η</b> &nbsp;<span style="color:var(--ink-3)">(Formula 1)</span><br>
          ${esc(eq)} = <b>${y.v} ${y.u}/yr</b><br>
          <span style="color:var(--ink-3)">A horizontal projection of the collection area · e surface yield coefficient · h rainfall depth · η treatment efficiency. 1 mm on 1 m² = 1 litre.</span>
        </p>`) +
      grp("Annual balance", `
        <dl class="rwc-rep-kv" style="font-size:12px">
          <dt>Rainfall on the catchment</dt><dd>${fmtVol(res.annualInflow).v} ${fmtVol(res.annualInflow).u}</dd>
          <dt>Non-potable demand</dt><dd>${fmtVol(res.annualDemand).v} ${fmtVol(res.annualDemand).u}</dd>
          <dt>Supplied from the store</dt><dd>${fmtVol(b.totalSupplied).v} ${fmtVol(b.totalSupplied).u}</dd>
          <dt>Mains top-up</dt><dd>${fmtVol(b.totalDeficit).v} ${fmtVol(b.totalDeficit).u}</dd>
          <dt>Overflow to drain</dt><dd>${fmtVol(b.totalOverflow).v} ${fmtVol(b.totalOverflow).u}</dd>
          <dt>Coverage rate C<sub>r</sub> (A.5)</dt><dd>${fmtPct(b.saving)}</dd>
          <dt>${model.system.daily ? "Days" : "Months"} fully supplied</dt><dd>${fmtPct(b.reliability)}</dd>
        </dl>
        <p class="rwc-note">C<sub>r</sub> is the standard's measure — the volume supplied over the volume demanded (Formula A.5). The row below it counts <em>steps</em> where demand was met in full; that is this tool's own figure, not the standard's, and the two differ whenever a shortfall is partial.</p>
        <p class="rwc-note">Balance closes: inflow = supplied + overflow ± change in store (${nf(b.totalInflow - b.totalSupplied - b.totalOverflow, 0)} L residual).</p>`) +
      grp("Storage capacity", `
        <dl class="rwc-rep-kv" style="font-size:12px">
          <dt>BS basic approach (A.2.1)</dt><dd>${fmtVol(res.simple).v} ${fmtVol(res.simple).u}</dd>
          <dt>Profile-optimised (curve knee)</dt><dd>${fmtVol(res.knee).v} ${fmtVol(res.knee).u}</dd>
          <dt>In this design</dt><dd>${fmtVol(res.capacity).v} ${fmtVol(res.capacity).u}</dd>
          <dt>Days of average demand</dt><dd>${nf(res.daysStorage, 0)}</dd>
        </dl>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="rwc-btn" data-apply-cap="${res.simple.toFixed(0)}" style="flex:1;justify-content:center;border-color:var(--line);background:var(--surface-2)">Use A.2.1</button>

      grp("Gutters & downpipes", `

  }

  function monthTable() {

      <tbody>${MONTHS.map((_, i) => row(i)).join("")}</tbody>

  /* ═══════════════ climate helpers ═══════════════ */

  function applyCity(id) {
    const c = CITY_BY_ID[id]; if (!c) return;
    model.climate.cityId = id;
    model.climate.monthly = c.r.slice();
    model.climate.dpd = c.dpd;
    model.climate.label = c.name;
    model.climate.annual = annualOf(c.r);
    model.climate.source = "preset";
    model.climate.lat = c.lat == null ? 0 : c.lat;
    model.climate.lon = c.lon == null ? 0 : c.lon;
  }
  function applyAnnual() {
    const c = CITY_BY_ID[model.climate.cityId] || CITY_BY_ID.lon;
    const base = sum(c.r) || 1;
    const target = Math.max(0, model.climate.annual);
    model.climate.monthly = c.r.map(v => (v / base) * target);
    model.climate.label = "Annual " + nf(target, 0) + " mm (" + c.name.split(",")[0] + " shape)";
    model.climate.source = "preset-scaled";
  }

  /* ═══════════════ menus ═══════════════ */

  let openMenuEl = null;
  function closeMenu() {
    if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
    $$("[aria-haspopup='menu']").forEach(b => b.setAttribute("aria-expanded", "false"));
  }
  function menu(btn, html) {
    const wasOpen = btn.getAttribute("aria-expanded") === "true";
    closeMenu();
    if (wasOpen) return;
    btn.setAttribute("aria-expanded", "true");
    const el = document.createElement("div");
    el.className = "rwc-menu"; el.setAttribute("role", "menu");
    el.innerHTML = html;
    root.appendChild(el);                       // inside #rwc-app: tokens must resolve
    const r = btn.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    el.style.left = Math.max(6, Math.min(r.left, vw - el.offsetWidth - 8)) + "px";
    /* below the button, flipped above it if it would run off the bottom */
    const h = el.offsetHeight;
    el.style.top = (r.bottom + 5 + h <= vh - 8 ? r.bottom + 5
                  : r.top - 5 - h >= 8         ? r.top - 5 - h
                  : Math.max(8, vh - h - 8)) + "px";
    openMenuEl = el;
    const first = el.querySelector(".rwc-menu-item"); if (first) first.focus();
  }
  const mItem = (attr, label, sub) =>
    `<button class="rwc-menu-item" role="menuitem" ${attr}><span class="rwc-mi-txt">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></button>`;

  document.addEventListener("click", e => {
    if (openMenuEl && !openMenuEl.contains(e.target) && !e.target.closest("[aria-haspopup='menu']")) closeMenu();
  });

  /* ═══════════════ IO ═══════════════ */

  function download(filename, blob) {
    let url;
    try {
      url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      toast("Exported " + filename);
    } catch (err) {
      try { window.open(url, "_blank"); toast("Download blocked here — opened in a new tab"); }
      catch (e2) { toast("Export blocked by the page's sandbox. Open the file directly instead."); }
    }
  }

  /* render the scene offscreen at print scale, with a title block */
  function renderPlate(wPx, hPx, scale) {
    const c = document.createElement("canvas");
    c.width = Math.round(wPx * scale); c.height = Math.round(hPx * scale);
    const g = c.getContext("2d");
    g.setTransform(scale, 0, 0, scale, 0, 0);
    R3D.render(g, wPx, hPx, model, geom, res, { selected: null, scale: 1 });

    const P = R3D.palette();
    const pad = 14, barH = 46;
    g.fillStyle = P.surface; g.globalAlpha = .93;
    g.fillRect(0, hPx - barH, wPx, barH);
    g.globalAlpha = 1;
    g.strokeStyle = P.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, hPx - barH); g.lineTo(wPx, hPx - barH); g.stroke();

    g.textBaseline = "alphabetic"; g.textAlign = "left";
    g.fillStyle = P.ink;
    g.font = "600 14px -apple-system, Segoe UI, Roboto, sans-serif";
    g.fillText(model.name, pad, hPx - barH + 19);
    g.fillStyle = P.ink3;
    g.font = "11px -apple-system, Segoe UI, Roboto, sans-serif";
    const line = `${nf(geom.catchment,1)} m² catchment · ${esc(model.climate.label)} ${nf(res.annualRain,0)} mm/yr · `
      + `${fmtVol(res.annualInflow).v} ${fmtVol(res.annualInflow).u}/yr · ${fmtPct(res.bal.saving)} of demand met · `
      + `${fmtVol(res.capacity).v} ${fmtVol(res.capacity).u} store`;
    g.fillText(line, pad, hPx - barH + 35);

    g.textAlign = "right"; g.fillStyle = P.ink2;
    g.font = "600 11px -apple-system, Segoe UI, Roboto, sans-serif";
    g.fillText("© Karam Al-Obaidi", wPx - pad, hPx - barH + 19);
    g.fillStyle = P.ink3; g.font = "10px -apple-system, Segoe UI, Roboto, sans-serif";
    g.fillText("Rainwater Harvesting Studio v" + VERSION.number + " · BS EN 16941-1", wPx - pad, hPx - barH + 34);
    return c;
  }

  function exportPNG() {
    const w = Math.max(1000, Math.round(cw)), h = Math.max(650, Math.round(ch));
    const c = renderPlate(w, h, 3);
    const name = model.name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "model";
    if (c.toBlob) c.toBlob(b => b ? download(name + ".png", b) : toast("Image export failed"), "image/png");
    else download(name + ".png", dataURLtoBlob(c.toDataURL("image/png")));
  }
  function dataURLtoBlob(u) {
    const parts = u.split(","), bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: "image/png" });
  }

  function exportCSV() {
    const b = res.bal;
    const rows = [
      ["Rainwater Harvesting Studio — monthly results"],
      ["Model", model.name], ["Location", model.climate.label],
      ["Rainfall source", rainfallProvenanceFor(model.climate)],
      ["Catchment m2", nf(geom.catchment, 2)], ["Roof surface m2", nf(geom.surface, 2)],
      ["Mean surface yield coefficient e", nf(geom.ycMean, 3)], ["Treatment efficiency coefficient eta", nf(model.system.filterCoef, 2)],
      ["Storage capacity L", nf(res.capacity, 0)], ["Balance step", model.system.daily ? "daily" : "monthly"],
      [],
      ["Month", "Rainfall mm", "Wet days", "Roof inflow L", "Demand L", "Supplied L", "Stored end L", "Overflow L", "Mains top-up L"]
    ];
    for (let i = 0; i < 12; i++) rows.push([MONTHS[i],
      nf(model.climate.monthly[i], 1), res.wd[i], nf(b.inflow[i], 0), nf(b.demand[i], 0),
      nf(b.supplied[i], 0), nf(b.level[i], 0), nf(b.overflow[i], 0), nf(b.deficit[i], 0)]);
    rows.push(["Year", nf(res.annualRain, 1), sum(res.wd), nf(b.totalInflow, 0), nf(b.totalDemand, 0),
      nf(b.totalSupplied, 0), "", nf(b.totalOverflow, 0), nf(b.totalDeficit, 0)]);
    rows.push([], ["(c) Karam Al-Obaidi — method BS EN 16941-1:2024"]);
    const csv = rows.map(r => r.map(c => {
      const s = String(c == null ? "" : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")).join("\r\n");
    const name = model.name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "model";
    download(name + "-monthly.csv", new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  }

  function saveJSON() {
    const out = CLONE(model);
    out.schema = 2; out.app = "Rainwater Harvesting Studio"; out.saved = new Date().toISOString();
    const name = model.name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "model";
    download(name + ".json", new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  }

  /* Rebuild a full model from a saved object, filling in anything the file
     predates or omits. Shared by Open, the autosave restore and Presentation. */
  function hydrate(data) {
    const base = newModel();
    const m = Object.assign(base, data);
    m.blocks  = data.blocks.map(b => Object.assign(newBlock(), b, {
      material: matKey(b.material),
      roof: Object.assign(newBlock().roof, b.roof || {}) }));
    m.climate = Object.assign(base.climate, data.climate || {});
    m.demand  = Object.assign(base.demand,  data.demand  || {});
    m.system  = Object.assign(base.system,  data.system  || {});
    m.view    = Object.assign(base.view,    data.view    || {});
    if (!Array.isArray(m.climate.monthly) || m.climate.monthly.length !== 12)
      m.climate.monthly = CITY_BY_ID.lon.r.slice();
    m.climate.monthly = m.climate.monthly.map(v => Math.max(0, +v || 0));
    if (!Array.isArray(m.demand.uses) || !m.demand.uses.length) m.demand.uses = base.demand.uses;
    return m;
  }

  function loadJSON(text, label) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { toast("That file is not valid JSON."); return; }
    if (!data || !Array.isArray(data.blocks) || !data.blocks.length) { toast("No blocks in that file — is it a Rainwater Harvesting Studio model?"); return; }
    if (data.schema && data.schema > 2) toast("Saved by a newer version — loading what is readable.");
    model = hydrate(data);
    selectedId = model.blocks[0].id;
    history = []; hIndex = -1; snapshot();
    refresh(true); fitView(); syncViewChips();
    toast("Opened " + (label || model.name));
  }

  /* ═══════════════ Explain sheet ═══════════════
     Walks the calculation with this model's own numbers, says plainly which
     figure is the answer, and diagnoses what is limiting the design. Shares the
     report's overlay and print stylesheet.
     ============================================================== */

  function explainSteps() {
    const A = geom.catchment, R = res.annualRain;
    const Yc = geom.ycMean, Fc = model.system.filterCoef;
    const b = res.bal;
    const surf = geom.surface, extra = A > 0 ? (surf / A - 1) * 100 : 0;
    const spill = res.annualInflow > 0 ? b.totalOverflow / res.annualInflow : 0;
    const V = v => { const f = fmtVol(v); return f.v + " " + f.u; };

    return [
      { id:"catchment", tag:"Input", title:"Catchment area  A", val:nf(A,1) + " m²",
        sub:"plan-projected roof area, including the eaves overhang",
        note: extra > 1.5
          ? `The roof <em>surface</em> is ${nf(surf,1)} m² — ${nf(extra,0)}% more. Rain falls vertically, so only the plan projection collects it. That extra surface costs material and delivers no extra water.`
          : extra > 0.05
          ? `The roof surface is ${nf(surf,1)} m², within ${nf(extra,1)}% of the catchment at this pitch. Steepen it and the surface grows while the catchment does not.`
          : `This roof is horizontal in projection, so catchment and surface are identical.` },

      { id:"rain", tag:"Input", title:"Rainfall  R", val:nf(R,0) + " mm/yr",
        sub:esc(model.climate.label),
        note:`1 mm falling on 1 m² is 1 litre, so ${nf(A,1)} m² under ${nf(R,0)} mm would give ${V(A*R)} if nothing were lost.` },

      { id:"losses", tag:"Input", title:"Losses  e × η", val:nf(Yc*Fc,3),
        sub:`e ${nf(Yc,2)} (surface) × η ${nf(Fc,2)} (treatment)`,
        note:`e is the surface yield coefficient from Table 2 of the standard — what the roof surface itself loses to wetting, evaporation and wind. η is the hydraulic treatment efficiency coefficient; where the manufacturer states nothing, the standard says 0.9 can be used for a system with no additional treatment. You keep ${nf(Yc*Fc*100,0)}%.` },

      { id:"yield", tag:"Harvest", title:"Annual yield  Y = A · e · h · η", val:V(res.annualInflow),
        sub:`${nf(A,1)} × ${nf(R,0)} × ${nf(Yc,2)} × ${nf(Fc,2)}`,
        note:`What the roof actually delivers to the tank in a year. This is the harvest — it is not the same as what gets used.` },

      { id:"demand", tag:"Need", title:"Non-potable demand  D", val:V(res.annualDemand),
        sub:`${model.demand.occupants} people` + (model.demand.irrigArea > 0 ? ` + ${nf(model.demand.irrigArea,0)} m² irrigated` : ""),
        note:`What the building wants for WC flushing, laundry and the other uses you switched on. Rainwater is only useful up to this figure — beyond it there is nowhere for the water to go.` },

      { id:"store", tag:"Deliverable", title:"Storage capacity  C", val:V(res.capacity), key:true,
        sub:`${nf(res.daysStorage,0)} days of average demand`,
        note:`<b>This is the answer you put on the drawing.</b> The tank does not create water — it carries it from wet days to dry ones. Everything above sizes it; everything below justifies it.` },

      { id:"met", tag:"Justification", title:"Demand met", val:fmtPct(b.saving),
        sub:`${V(b.totalSupplied)} supplied of ${V(res.annualDemand)} wanted`,
        note:`BS calls this the water saving efficiency. It is how you defend the tank size: a bigger tank raises this number until the curve flattens, and past that point it buys nothing.` },

      { id:"mains", tag:"Benefit", title:"Mains displaced", val:nf(res.mainsSaved,1) + " m³/yr",
        sub:`≈ ${nf(res.costSaved,0)} per year at ${nf(model.system.tariff,2)}/m³`,
        note:`The same ${V(b.totalSupplied)}, expressed as the benefit: mains water you did not have to buy. It is an outcome, not a design input.` },

      { id:"overflow", tag:"Diagnostic", title:"Overflow", val:V(b.totalOverflow),
        sub:`${fmtPct(spill)} of the harvest`,
        note: spill > 0.4
          ? `Most of the harvest is spilling. That points at demand or storage, not at the roof — a larger catchment would simply spill more.`
          : `What the store could not hold when it was already full. A modest spill is normal and unavoidable.` }
    ];
  }

  /* which constraint is actually binding, from this model's numbers */
  function diagnose() {
    const b = res.bal;
    const harvest = res.annualInflow;
    const spill = harvest > 0 ? b.totalOverflow / harvest : 0;
    const met = b.saving;
    const kneePt = res.sweep.reduce((a, q) => Math.abs(q.cap - res.knee) < Math.abs(a.cap - res.knee) ? q : a, res.sweep[0]);
    const V = volSet([res.capacity, res.knee, res.simple]);

    /* what would still spill even after raising the store to the knee — the
       difference between "the tank is too small" and "the roof is too big" */
    const spillAtKnee = harvest > 0
      ? Math.max(0, harvest - kneePt.saving * res.annualDemand) / harvest : 0;
    const oversized = spillAtKnee > 0.40
      ? ` Even at the knee, <b>${fmtPct(spillAtKnee)} of the harvest would still spill</b> — this roof collects far more than the building can use, so the tank can only ever serve that demand.`
      : "";

    if (res.annualDemand <= 0)
      return { t:"No demand set", w:true,
        d:`Nothing is drawing on the store, so every drop collected spills. Set the occupancy or an irrigated area on the Demand tab before reading any of these figures.` };

    /* Test this BEFORE the store: if an unlimited tank still could not meet the
       demand, the store is not the constraint however small it currently is. */
    if (res.maxSaving < 0.45)
      return { t:"Yield-limited", w:true,
        d:`There is not enough water. Even with an <b>unlimited</b> tank, this roof under this rainfall could meet only <b>${fmtPct(res.maxSaving)}</b> of the demand — ${nf(res.annualRain,0)} mm a year across ${nf(geom.catchment,1)} m² simply does not add up to ${volSet([res.annualDemand])(res.annualDemand)}. A bigger tank cannot create water. <b>Biggest lever: more catchment area, a surface with a higher yield coefficient</b> (this roof is e ${nf(geom.ycMean,2)}; smooth pitched is 0.90)<b>, or less demand.</b>` };

    if (res.capacity < res.knee * 0.92 && kneePt.saving > met + 0.03)
      return { t: oversized ? "Storage-limited, on an oversized roof" : "Storage-limited", w:true,
        d:`The tank is the binding constraint. At ${V(res.capacity)} it meets ${fmtPct(met)} of demand; the curve's knee at <b>${V(res.knee)}</b> would reach <b>${fmtPct(kneePt.saving)}</b> for the same roof and the same rainfall. <b>Biggest lever: increase the store to the knee.</b>` + oversized };

    if (spill > 0.40 && met > 0.80)
      return { t:"Demand-limited", w:false,
        d:`The roof collects far more than the building uses — ${fmtPct(spill)} of the harvest spills while ${fmtPct(met)} of demand is already met. A bigger roof or a bigger tank changes almost nothing. <b>Biggest lever: connect more non-potable uses, or accept that this roof is oversized for this demand.</b>` };

    if (spill > 0.40)
      return { t:"Demand-limited", w:false,
        d:`${fmtPct(spill)} of the harvest spills while only ${fmtPct(met)} of demand is met — the store empties between storms and overflows during them. <b>Biggest lever: spread the demand, or raise the store</b> so more of each storm is retained.` };

    return { t:"Well matched", w:false,
      d:`Harvest, demand and store are in reasonable balance: ${fmtPct(met)} of demand met with ${fmtPct(spill)} spilled. Sizing is close to the knee at ${V(res.knee)}.` };
  }

  function setMode(m) {
    const leaving = mode === "present" && m !== "present";
    if (m === "present" && mode !== "present") {
      /* stash the working model: presentation must never destroy unsaved work */
      present.saved = JSON.stringify(model);
      present.index = -1;
    }
    if (leaving) {
      if (present.index >= 0 && present.saved) {          // a demo was loaded over it
        model = hydrate(JSON.parse(present.saved));
        selectedId = model.blocks[0].id;
        refresh(true); fitView();
      }
      present.saved = null; present.index = -1;
    }
    mode = m;
    root.dataset.mode = m;
    $("#rwc-mode-label").textContent = m === "design" ? "Design" : m === "analysis" ? "Analysis" : "Presentation";
    if (m === "present") presentHud();
    setTimeout(() => {
      if (m === "present") fitView(); else draw();
      if (m === "analysis") charts();
    }, 30);
  }

  /* The deck is [your model, ...the demo library]. Index -1 is your own model,
     so entering presentation shows what you were working on, not a demo. */
  function presentShow(i) {
    const N = DEMOS.length;
    present.index = i > N - 1 ? -1 : i < -1 ? N - 1 : i;
    if (present.index >= 0) {
      const d = DEMOS[present.index];
      model = d.make(); selectedId = model.blocks[0].id;
    } else if (present.saved) {
      model = hydrate(JSON.parse(present.saved)); selectedId = model.blocks[0].id;
    }
    refresh(true); fitView(); presentHud();
  }
  function presentHud() {
    const N = DEMOS.length;
    if (present.index >= 0) {
      const d = DEMOS[present.index];

      $("#rwc-p-sub").textContent = d.caption;
      $("#rwc-p-count").textContent = (present.index + 2) + " / " + (N + 1);
    } else {
      $("#rwc-p-title").textContent = model.name;

        + `${fmtPct(res.bal.saving)} of demand met from a ${fmtVol(res.capacity).v} ${fmtVol(res.capacity).u} store.`;
      $("#rwc-p-count").textContent = "1 / " + (N + 1);

  /* ═══════════════ events ═══════════════ */

  function commit() { snapshot(); }

  /* --- parameter inputs ------------------------------------------------- */

  /* Push a value into every control bound to `path` and its readout. Used by the
     slider/number pair and by the drag, which moves a block without rebuilding
     the panel (that would fight the pointer). */
  function syncField(path, v, except) {
    const nodes = root.querySelectorAll(`[data-path="${path}"]`);
    let dp = 0, unit = "";
    for (const o of nodes) if (o.dataset.dp !== undefined) { dp = +o.dataset.dp || 0; unit = o.dataset.unit || ""; }
    for (const o of nodes) {
      if (o === except) continue;
      if (o.type === "range") o.value = v;
      else if (o.type === "number") o.value = nf(v, dp).replace(/,/g, "");
    }
    const out = root.querySelector(`[data-out="${path}"]`);
    if (out) out.textContent = nf(v, dp) + (unit ? " " + unit : "");
  }

  root.addEventListener("input", e => {
    const t = e.target;

    if (t.matches("input[type=text][data-path]")) {
      setPath(t.dataset.path, t.value); tree(); refresh(false); return;
    }
    if (t.matches("input[type=range][data-path], input[type=number][data-path]")) {
      let v = parseFloat(t.value);
      if (!isFinite(v)) return;
      const mn = parseFloat(t.min), mx = parseFloat(t.max);
      if (isFinite(mn)) v = Math.max(mn, v);
      if (isFinite(mx)) v = Math.min(mx, v);
      setPath(t.dataset.path, v);
      syncField(t.dataset.path, v, t);
      if (t.dataset.path === "climate.annual") applyAnnual();
      refresh(false); return;
    }
    if (t.matches("input[data-month]")) {
      const i = +t.dataset.month, v = Math.max(0, parseFloat(t.value) || 0);
      model.climate.monthly[i] = v;
      model.climate.annual = sum(model.climate.monthly);
      model.climate.label = "Custom monthly profile";
      model.climate.source = "manual";
      const holder = root.querySelector("#panel-climate .rwc-card");
      if (holder) holder.innerHTML = CHART.wrap(CHART.rainfall(model.climate.monthly));
      refresh(false); return;
    }
    if (t.matches("input[data-use][data-field=lpd]")) {
      model.demand.uses[+t.dataset.use].lpd = Math.max(0, parseFloat(t.value) || 0);
      refresh(false); return;
    }
  });

  root.addEventListener("change", e => {
    const t = e.target;
    if (t.matches("input[type=checkbox][data-path]")) { setPath(t.dataset.path, t.checked); commit(); refresh(true); return; }
    if (t.matches("input[data-use][data-field=on]"))  { model.demand.uses[+t.dataset.use].on = t.checked; commit(); refresh(true); return; }
    if (t.matches("select[data-path]")) {
      setPath(t.dataset.path, t.dataset.num ? +t.value : t.value); commit(); refresh(true); return;
    }
    if (t.id === "rwc-city") { applyCity(t.value); commit(); refresh(true); return; }
    if (t.matches("[data-path], [data-month], [data-use]")) commit();
  });

  root.addEventListener("click", e => {
    const t = e.target;
    const seg = t.closest(".rwc-seg button[data-path]");
    if (seg) {
      setPath(seg.dataset.path, seg.dataset.val);
      if (seg.dataset.path === "climate.mode") {
        if (seg.dataset.val === "preset") applyCity(model.climate.cityId);
        if (seg.dataset.val === "annual") applyAnnual();
      }
      commit(); refresh(true); return;
    }
    const rf = t.closest("[data-roof]");
    if (rf) { block().roof.type = rf.dataset.roof; commit(); refresh(true); return; }

    const cap = t.closest("[data-apply-cap]");
    if (cap) { model.system.tankMode = "manual"; model.system.tank = +cap.dataset.applyCap; commit(); refresh(true); return; }

    if (t.closest("#rwc-var-add")) {
      variants.push({ name: model.name + (variants.length ? " · " + (variants.length + 1) : ""),
        json: JSON.stringify(model),
        s: { catchment: geom.catchment, supplied: res.bal.totalSupplied, saving: res.bal.saving, cap: res.capacity } });
      if (variants.length > 6) variants.shift();
      refresh(true); toast("Variant saved"); return;
    }
    const vl = t.closest("[data-var-load]");
    if (vl) { loadJSON(variants[+vl.dataset.varLoad].json, variants[+vl.dataset.varLoad].name); return; }
    const vd = t.closest("[data-var-del]");
    if (vd) { variants.splice(+vd.dataset.varDel, 1); refresh(true); return; }

    if (t.closest("#rwc-dup")) {
      const b = block(), c = CLONE(b);
      c.id = uid(); c.name = b.name + " copy"; c.x = b.x + b.w + 2;
      model.blocks.push(c); selectedId = c.id; commit(); refresh(true); return;
    }
    if (t.closest("#rwc-del")) { removeBlock(selectedId); return; }
    if (t.closest("#rwc-tree-add")) { addBlock(); return; }

    const del = t.closest("[data-del]");
    if (del) { e.stopPropagation(); removeBlock(del.dataset.del); return; }
    const item = t.closest("[data-block]");
    if (item) { selectedId = item.dataset.block; refresh(true); return; }

    if (t.closest("#rwc-t-tank")) { model.view.system = !model.view.system; syncViewChips(); draw(); return; }
    if (t.closest("#rwc-t-dims")) { model.view.dims = !model.view.dims; syncViewChips(); draw(); return; }

    const ex = t.closest("[data-explain]");
    if (ex) { buildExplain(ex.dataset.explain); return; }

    if (t.closest("#rwc-p-prev")) { presentShow(present.index - 1); return; }
    if (t.closest("#rwc-p-next")) { presentShow(present.index + 1); return; }

  function setTab(name) {
    tab = name;

  function addBlock() {
    const b = newBlock({ name: "Block " + (model.blocks.length + 1) });
    /* Clear the WHOLE model's plan extent, overhangs included. The old rule
       offset from the last block only and ignored the new block's own width, so
       a new block could land on top of an existing one. */
    if (model.blocks.length) {
      const edge = Math.max(...model.blocks.map(o => o.x + o.w / 2 + Math.max(0, o.roof.overhang)));
      const zs = model.blocks.map(o => o.z);
      b.x = Math.round((edge + 3 + b.w / 2 + Math.max(0, b.roof.overhang)) * 4) / 4;
      b.z = Math.round(((Math.min(...zs) + Math.max(...zs)) / 2) * 4) / 4;
    }
    model.blocks.push(b); selectedId = b.id; commit(); refresh(true); fitView();
    toast("Block added — drag it in the model space to reposition it");
  }
  function removeBlock(id) {
    if (model.blocks.length < 2) { toast("A model needs at least one block."); return; }
    const i = model.blocks.findIndex(b => b.id === id);
    if (i < 0) return;
    model.blocks.splice(i, 1);
    if (selectedId === id) selectedId = model.blocks[Math.max(0, i - 1)].id;
    commit(); refresh(true);
  }

  /* --- canvas interaction ---------------------------------------------- */

  const pointers = new Map();
  let dragMode = null, lastX = 0, lastY = 0, moved = 0, pinchDist = 0, grab = null;
  const local = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y); dragMode = "pinch";
      return;
    }
    lastX = e.clientX; lastY = e.clientY; moved = 0; grab = null;
    const wantPan = e.button === 2 || e.button === 1 || e.shiftKey;

    /* Pressing on the block that is ALREADY selected moves it. Empty space, an
       unselected block, the right/middle button or Shift all still orbit or pan,
       so a block cannot be dragged by accident. */
    if (!wantPan) {
      const [px, py] = local(e);
      const hit = R3D.pick(px, py, cw, ch, geom);
      if (hit && hit === selectedId) {
        const b = block();
        const g = R3D.screenToGround(px, py, cw, ch, 0);
        if (b && g) {
          dragMode = "move";
          grab = { dx: g[0] - b.x, dz: g[2] - b.z, x0: b.x, z0: b.z };
          canvas.style.cursor = "grabbing";
          return;
        }
      }
    }
    dragMode = wantPan ? "pan" : "orbit";
    canvas.classList.add("rwc-dragging");
  });
  let hoverRaf = 0;
  canvas.addEventListener("pointermove", e => {
    /* cursor affordance: the selected block is draggable */
    if (!dragMode && !hoverRaf) {
      const [hx, hy] = local(e);
      hoverRaf = requestAnimationFrame(() => {
        hoverRaf = 0;
        if (dragMode || !geom) return;
        const hit = R3D.pick(hx, hy, cw, ch, geom);
        canvas.style.cursor = hit && hit === selectedId ? "move" : "";
      });
    }
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (dragMode === "move" && grab) {
      const [px, py] = local(e);
      const g = R3D.screenToGround(px, py, cw, ch, 0);
      moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      lastX = e.clientX; lastY = e.clientY;
      if (g) {
        const b = block();
        const snap = e.altKey ? 0 : 0.25;              // Alt for free positioning
        const round = v => snap ? Math.round(v / snap) * snap : v;
        b.x = clamp(round(g[0] - grab.dx), -400, 400);
        b.z = clamp(round(g[2] - grab.dz), -400, 400);
        syncField("b.x", b.x); syncField("b.z", b.z);
        refreshGeom();
      }
      return;
    }
    if (dragMode === "pinch" && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) R3D.cam.dist = clamp(R3D.cam.dist * (pinchDist / Math.max(1, d)), 2, 4000);
      pinchDist = d; draw(); return;
    }
    if (!dragMode) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if (dragMode === "orbit") {
      R3D.cam.az -= dx * 0.008;
      R3D.cam.el = clamp(R3D.cam.el + dy * 0.006, -1.45, 1.55);
    } else {
      const s = R3D.cam.dist * 0.0016;
      const ca = Math.cos(R3D.cam.az), sa = Math.sin(R3D.cam.az);
      R3D.cam.target[0] -= (dx * ca - 0) * s;
      R3D.cam.target[2] += (dx * sa) * s;
      R3D.cam.target[1] += dy * s;
    }
    draw();
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2 && dragMode === "pinch") dragMode = null;
    if (pointers.size === 0) {
      if (dragMode === "orbit" && moved < 5) {
        const [px, py] = local(e);
        const hit = R3D.pick(px, py, cw, ch, geom);
        if (hit && hit !== selectedId) { selectedId = hit; refresh(true); }
      } else if (dragMode === "move") {
        canvas.style.cursor = "";
        const b = block();
        if (b && (b.x !== grab.x0 || b.z !== grab.z0)) {   // a click is not an edit
          commit(); refresh(true);
          toast(`${b.name} moved to ${nf(b.x, 2)}, ${nf(b.z, 2)} m`);
        }
      }
      grab = null; dragMode = null; canvas.classList.remove("rwc-dragging");
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    R3D.cam.dist = clamp(R3D.cam.dist * Math.exp(clamp(e.deltaY, -120, 120) * 0.0011), 2, 4000);
    draw();
  }, { passive: false });

  canvas.addEventListener("keydown", e => {
    const k = e.key;
    /* Shift + arrows nudge the selected block; plain arrows keep orbiting */
    if (e.shiftKey && k.indexOf("Arrow") === 0) {
      const b = block(); if (!b) return;
      e.preventDefault();
      const ax = R3D.groundAxes(), step = e.ctrlKey || e.metaKey ? 1 : 0.25;
      const v = k === "ArrowLeft"  ? [-ax.right[0], -ax.right[1]]
              : k === "ArrowRight" ? [ ax.right[0],  ax.right[1]]
              : k === "ArrowUp"    ? [ ax.fwd[0],    ax.fwd[1]]
              :                      [-ax.fwd[0],   -ax.fwd[1]];
      b.x = clamp(Math.round((b.x + v[0]*step) / 0.25) * 0.25, -400, 400);
      b.z = clamp(Math.round((b.z + v[1]*step) / 0.25) * 0.25, -400, 400);
      syncField("b.x", b.x); syncField("b.z", b.z);
      commit(); refreshGeom();
      return;
    }
    if (k === "ArrowLeft")  { R3D.cam.az -= 0.09; draw(); e.preventDefault(); }
    else if (k === "ArrowRight") { R3D.cam.az += 0.09; draw(); e.preventDefault(); }
    else if (k === "ArrowUp")    { R3D.cam.el = clamp(R3D.cam.el + 0.06, -1.45, 1.55); draw(); e.preventDefault(); }
    else if (k === "ArrowDown")  { R3D.cam.el = clamp(R3D.cam.el - 0.06, -1.45, 1.55); draw(); e.preventDefault(); }
    else if (k === "+" || k === "=") { R3D.cam.dist = clamp(R3D.cam.dist * 0.88, 2, 4000); draw(); }
    else if (k === "-" || k === "_") { R3D.cam.dist = clamp(R3D.cam.dist * 1.14, 2, 4000); draw(); }
    else if (k === "f" || k === "F") fitView();
  });

  /* --- global keys ------------------------------------------------------ */

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""));
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === "s") { e.preventDefault(); saveJSON(); return; }
      if (k === "o") { e.preventDefault(); $("#rwc-file").click(); return; }
      if (k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (k === "y") { e.preventDefault(); redo(); return; }
      return;
    }
    if (typing) return;
    if (e.key === "Escape") { if (mode === "present") setMode("design"); else closeMenu(); return; }
    if (mode === "present") {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); presentShow(present.index + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); presentShow(present.index - 1); }
      else if (e.key === "p" || e.key === "P") setMode("design");
      return;
    }
    if (e.key === "p" || e.key === "P") setMode(mode === "present" ? "design" : "present");
    if (e.key === "f" || e.key === "F") fitView();
  });

  /* --- chart tooltips --------------------------------------------------- */

  const tipEl = document.createElement("div");
  tipEl.style.cssText = "position:fixed;z-index:210;padding:5px 9px;border-radius:5px;font:12px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)";
  root.appendChild(tipEl);
  function showTip(el, x, y) {
    const P = R3D.palette();
    tipEl.style.background = P.ink; tipEl.style.color = P.surface;
    tipEl.textContent = el.dataset.tip;
    tipEl.style.opacity = "1";
    tipEl.style.left = Math.min(window.innerWidth - tipEl.offsetWidth - 8, x + 12) + "px";
    tipEl.style.top  = Math.max(6, y - 34) + "px";
  }
  const hideTip = () => { tipEl.style.opacity = "0"; };
  document.addEventListener("pointermove", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("focusin", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else hideTip();

  /* --- resize ----------------------------------------------------------- */

  if (window.ResizeObserver) new ResizeObserver(() => draw()).observe($("#rwc-view"));
  else window.addEventListener("resize", () => draw());
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { R3D.invalidateTheme(); draw(); });

  /* ═══════════════ live climate fetch (optional) ═══════════════ */

  async function fetchClimate() {
    const note = $("#rwc-fetch-note");
    const lat = parseFloat($("#rwc-lat").value), lon = parseFloat($("#rwc-lon").value);
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
      note.textContent = "Enter a valid latitude (−90 to 90) and longitude (−180 to 180)."; return;
    }
    note.textContent = `Fetching daily rainfall for ${CLIMATE_WINDOW.label} from Open-Meteo…`;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + lat.toFixed(3) +
        "&longitude=" + lon.toFixed(3) + "&start_date=" + CLIMATE_WINDOW.from + "&end_date=" + CLIMATE_WINDOW.to +
        "&daily=precipitation_sum&timezone=UTC";
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const time = j.daily && j.daily.time, pr = j.daily && j.daily.precipitation_sum;
      if (!time || !pr || !time.length) throw new Error("no data");
      /* same reduction the preset library was built with — see CLIMATE.reduce */
      const red = CLIMATE.reduce(time, pr);
      model.climate.monthly = red.monthly;
      model.climate.dpd = red.dpd;
      model.climate.annual = red.annual;
      model.climate.lat = lat; model.climate.lon = lon;
      model.climate.mode = "manual";
      model.climate.label = "Open-Meteo " + lat.toFixed(2) + ", " + lon.toFixed(2);
      model.climate.source = "open-meteo";
      commit(); refresh(true);
      toast("Loaded " + nf(model.climate.annual, 0) + " mm/yr from Open-Meteo");
    } catch (err) {
      note.innerHTML = "<b>Could not reach Open-Meteo.</b> This is expected offline, on a restricted classroom network, or under a strict WordPress content policy. Use a preset location or type the monthly values instead.";
      note.classList.add("rwc-warn");
    } finally { clearTimeout(timer); }
  }

  /* ═══════════════ guided tour ═══════════════
     Runs on every load unless the visitor has opted out, so a student arriving
     at the page cold always gets oriented. The opt-out is offered on every step,
     not only the last, and the tour stays reachable from the Help menu.
     ============================================================== */

  const TOUR_KEY = "rwc3d.tour";
  const tourWanted = () => { try { return localStorage.getItem(TOUR_KEY) !== "off"; } catch (e) { return true; } };
  const setTourWanted = on => { try { on ? localStorage.removeItem(TOUR_KEY) : localStorage.setItem(TOUR_KEY, "off"); } catch (e) {} };

  const TOUR = [
    { id:"welcome",
      title:"Welcome to Rainwater Harvesting Studio",
      body:"Shape a roof in 3D and watch its rainwater harvesting performance respond. The tour takes about a minute — skip it any time." },

    { id:"view", target:() => $("#rwc-view"), pad:-6,
      title:"The model space",
      body:"Drag to orbit, scroll to zoom. Click a roof to select its block, then <b>drag that block</b> to move it across the ground." },

    { id:"roof", target:() => $("#panel-roof .rwc-roofgrid"), before:() => setTab("roof"),
      title:"Eight parametric roof types",
      body:"Flat, gable, hip, shed, butterfly, sawtooth, vault and pyramid. Raise the pitch and the roof's <b>surface</b> area grows while its <b>catchment</b> does not — rain falls vertically, so catchment is the plan projection." },

    { id:"result", target:() => $('#rwc-tiles [data-explain="store"]'),
      title:"Storage capacity is the answer",

    { id:"explain", target:() => $("#rwc-explain-btn"),
      title:"Every number explained",
      body:"Opens a printable sheet that walks the whole calculation with your own figures, then diagnoses what is limiting the design. Clicking any result tile jumps straight to its step." },

    { id:"models", target:() => $("#rwc-models-btn"),
      title:"Ten teaching models",
      body:"Six roofs on one footprint, real building typologies, one building in three climates, and green versus hard roof. All fully editable once loaded." },

    { id:"mode", target:() => $("#rwc-mode-btn"),
      title:"Three workspaces",
      body:"Design for modelling, Analysis for charts and tables, and Presentation for the lecture theatre — arrow keys step through the models as slides." },

    { id:"export", target:() => $("#rwc-export-btn"),
      title:"Taking work away",
      body:"A 3× PNG with a title block, the A3 report sheet, the A4 explain sheet, monthly results as CSV, and the model as JSON to reopen later." },

    { id:"done",
      title:"That's the tour",
      body:"Reopen it any time from <b>Help</b> — the ⓘ at the top right. Your work is saved in this browser as you go." }
  ];

  let tourAt = -1, tourDom = null, tourTabWas = null;

  function startTour(from) {
    if (tourDom) return;
    tourTabWas = tab;
    const block = document.createElement("div"); block.className = "rwc-tour-block";
    const ring  = document.createElement("div"); ring.className  = "rwc-tour-ring";
    const card  = document.createElement("div"); card.className  = "rwc-tour-card";
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-modal", "true");
    card.setAttribute("aria-labelledby", "rwc-tour-h");
    card.innerHTML = `
      <span class="rwc-tour-caret" hidden></span>
      <div class="rwc-tour-top">
        <div class="rwc-tour-dots">${TOUR.map(() => "<i></i>").join("")}</div>
        <button class="rwc-tour-skip" id="rwc-tour-skip">Skip tour</button>
      </div>
      <h2 id="rwc-tour-h"></h2>
      <p id="rwc-tour-body"></p>
      <div class="rwc-tour-foot">
        <label class="rwc-check"><input type="checkbox" id="rwc-tour-off"> Don't show this on launch</label>
        <div class="rwc-tour-nav">
          <button class="rwc-btn" id="rwc-tour-prev">Back</button>
          <button class="rwc-btn rwc-primary" id="rwc-tour-next">Next</button>
        </div>
      </div>`;
    root.append(block, ring, card);
    tourDom = { block, ring, card };

    $("#rwc-tour-skip").onclick = () => endTour();
    $("#rwc-tour-prev").onclick = () => tourGo(tourAt - 1);
    $("#rwc-tour-next").onclick = () => tourAt >= TOUR.length - 1 ? endTour() : tourGo(tourAt + 1);
    $("#rwc-tour-off").checked = !tourWanted();
    $("#rwc-tour-off").onchange = e => {
      setTourWanted(!e.target.checked);
      toast(e.target.checked ? "The tour will not open on launch — it stays in the Help menu"
                             : "The tour will open on launch");
    };
    document.addEventListener("keydown", tourKeys, true);
    window.addEventListener("resize", tourPlace);
    tourGo(0);
  }

  function tourGo(i) {
    if (!tourDom) return;
    tourAt = clamp(i, 0, TOUR.length - 1);
    const st = TOUR[tourAt];
    if (st.before) st.before();
    $("#rwc-tour-h").textContent = st.title;
    $("#rwc-tour-body").innerHTML = st.body;
    $("#rwc-tour-prev").disabled = tourAt === 0;
    $("#rwc-tour-prev").style.opacity = tourAt === 0 ? .4 : 1;
    $("#rwc-tour-next").textContent = tourAt === TOUR.length - 1 ? "Done" : "Next";
    tourDom.card.querySelectorAll(".rwc-tour-dots i")
      .forEach((d, k) => d.classList.toggle("rwc-on", k === tourAt));
    tourPlace();
    $("#rwc-tour-next").focus();
  }

  function tourPlace() {
    if (!tourDom) return;
    const st = TOUR[tourAt];
    const { ring, card } = tourDom;
    const caret = card.querySelector(".rwc-tour-caret");
    const vw = window.innerWidth, vh = window.innerHeight;
    let el = st.target ? st.target() : null;
    let r = el ? el.getBoundingClientRect() : null;
    /* a step whose target is hidden at this width falls back to a centred card */
    if (r && (r.width < 2 || r.height < 2)) { el = null; r = null; }

    const cw2 = card.offsetWidth, ch2 = card.offsetHeight;
    if (!r) {
      ring.classList.add("rwc-nohole");
      ring.style.cssText += ";width:0px;height:0px;";
      ring.style.left = (vw / 2) + "px"; ring.style.top = (vh / 2) + "px";
      card.style.left = Math.round((vw - cw2) / 2) + "px";
      card.style.top  = Math.round((vh - ch2) / 2) + "px";
      caret.hidden = true;
      return;
    }
    if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "center" });
    r = el.getBoundingClientRect();

    const pad = st.pad === undefined ? 6 : st.pad;
    const x = Math.max(0, r.left - pad), y = Math.max(0, r.top - pad);
    const w = Math.min(vw, r.width + pad * 2), h = Math.min(vh, r.height + pad * 2);
    ring.classList.remove("rwc-nohole");
    ring.style.left = x + "px"; ring.style.top = y + "px";
    ring.style.width = w + "px"; ring.style.height = h + "px";

    const GAP = 14;
    const below = y + h + GAP + ch2 <= vh - 8;
    const top = below ? y + h + GAP : Math.max(8, y - GAP - ch2);
    const left = clamp(Math.round(x + w / 2 - cw2 / 2), 12, Math.max(12, vw - cw2 - 12));
    card.style.top = top + "px"; card.style.left = left + "px";

    /* caret points back at the target, clamped to stay on the card */
    const cx = clamp(x + w / 2 - left, 16, cw2 - 16);
    caret.hidden = false;
    caret.style.left = (cx - 6) + "px";
    if (below) { caret.style.top = "-7px";  caret.style.transform = "rotate(45deg)"; }
    else       { caret.style.top = (ch2 - 6) + "px"; caret.style.transform = "rotate(225deg)"; }
  }

  function tourKeys(e) {
    if (!tourDom) return;
    if (e.key === "Escape")      { e.preventDefault(); e.stopPropagation(); endTour(); }
    else if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); e.stopPropagation();
      tourAt >= TOUR.length - 1 ? endTour() : tourGo(tourAt + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); e.stopPropagation(); tourGo(tourAt - 1); }
  }

  function endTour() {
    if (!tourDom) return;
    document.removeEventListener("keydown", tourKeys, true);
    window.removeEventListener("resize", tourPlace);
    tourDom.block.remove(); tourDom.ring.remove(); tourDom.card.remove();
    tourDom = null; tourAt = -1;
    if (tourTabWas && tourTabWas !== tab) setTab(tourTabWas);
    tourTabWas = null;
  }

  /* ═══════════════ boot ═══════════════ */

  function boot() {
    const q = new URLSearchParams(location.search);
    if (q.get("embed") === "1") {
      /* fill the iframe exactly: 100dvh can be wrong inside a nested frame */
      root.classList.add("rwc-embed");
      document.documentElement.style.height = "100%";
      document.body.style.height = "100%";
      document.body.style.margin = "0";
    }
    const th = q.get("theme") || (() => { try { return localStorage.getItem("rwc3d.theme"); } catch (e) { return ""; } })();
    if (th === "dark" || th === "light") root.dataset.theme = th;

    const demoId = q.get("model");
    if (demoId && DEMO_BY_ID[demoId]) {
      model = DEMO_BY_ID[demoId].make();
    } else {
      try {
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
          const d = JSON.parse(saved);
          if (d && Array.isArray(d.blocks) && d.blocks.length) model = hydrate(d);
        }
      } catch (e) { /* ignore a corrupt or unavailable autosave */ }
    }
    if (!model.blocks.length) model = newModel();
    selectedId = model.blocks[0].id;

    const m = q.get("mode");
    snapshot();
    refresh(true);
    sizeCanvas(); R3D.fit(geom.bounds, cw, ch);
    syncViewChips();
    if (m === "analysis" || m === "present") setMode(m); else draw();

    /* Opens on every load unless the visitor opted out. ?tour=1 forces it (handy
       for a lecture link), ?tour=0 suppresses it for that link only. Never during
       a presentation — nothing should interrupt a lecture. */
    const tq = q.get("tour");
    const wants = tq === "1" ? true : tq === "0" ? false : tourWanted();
    if (wants && m !== "present") setTimeout(() => startTour("launch"), 550);
  }

  return { boot, refresh, startTour, endTour, get model() { return model; } };
})();

APP.boot();
</script>
</body>
</html>
