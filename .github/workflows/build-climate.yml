# Give the rainfall library a source.
#
# The 28 preset cities in index.html were originally written by hand from no
# dataset. This fetches real normals from the WMO World Weather Information
# Service, cross-checks them against the WMO Climate Normals 1991-2020, and
# commits the result to a branch for review.
#
# One button. No options to get wrong. It runs a dry pass first and stops there
# if anything is off, so a bad fetch cannot reach the branch.

name: Build climate library

on:
  workflow_dispatch:

# Needed to push the result to the climate-update branch. It never touches main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Informational: confirms the two cross-check files are still named what
      # the generator expects.
      - name: List the WMO Normals archive
        continue-on-error: true
        run: |
          url="https://www.ncei.noaa.gov/data/oceans/archive/arc0216/0253808/6.6/data/0-data/data-composite-primary-parameters/"
          {
            echo "<details><summary>Files in the WMO Normals archive</summary>"
            echo
            echo '```'
            curl -sSL --max-time 60 "$url" | grep -oE 'href="[^"]+\.csv"' | sed 's/href="//; s/"$//' | sort -u
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate: fetch everything and report, writing nothing. If any city fails to
      # resolve the generator exits non-zero here and the real run never happens.
      - name: Check every city resolves
        run: node tools/build-climate-wwis.mjs --dry-run

      - name: Fetch for real
        run: node tools/build-climate-wwis.mjs

      - name: Confirm the library is actually sourced
        run: |
          grep -q 'sourced: *true' index.html \
            || { echo "CLIMATE_SOURCE.sourced is still false — refusing to commit"; exit 1; }
          test -s docs/climate-source.json \
            || { echo "docs/climate-source.json is empty — refusing to commit"; exit 1; }

      # Committed as the repository's author, not as a bot: this history is
      # deliberately one person's. The branch is climate-update, never main, so
      # the change is reviewed before it reaches the app.
      - name: Commit to the climate-update branch
        run: |
          # -A, not -am: docs/climate-source.json is a NEW file, and `commit -am`
          # only stages files git already tracks. The first successful run wrote
          # the provenance record and then threw it away — while CLIMATE_SOURCE
          # pointed the reader at it.
          git add -A
          git -c user.name="Karam Al-Obaidi" \
              -c user.email="karam.arch85@gmail.com" \
              commit -m "Source the rainfall library from WMO gauge normals

          Written by .github/workflows/build-climate.yml. Figures quoted in
          docs/method-notes.html and pinned in the test suites were measured on
          the previous data and are now stale; they must be re-derived by
          measurement, not edited to fit."
          git push --force origin HEAD:climate-update

      - name: Say what happened
        run: |
          {
            echo "## Rainfall library rebuilt"
            echo
            echo "Committed to the **climate-update** branch. \`main\` is untouched."
            echo
            echo '```'
            git --no-pager diff --stat HEAD~1
            echo '```'
            echo
            echo "Nothing else to do — tell Claude the run finished."
          } >> "$GITHUB_STEP_SUMMARY"

      # A fallback copy, in case the branch is not convenient.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-data
          path: |
            index.html
            docs/climate-source.json
          if-no-files-found: warn
          retention-days: 30
